  <text x="326" y="228" font-size="11.5" fill="#5C9A46" font-weight="800" text-anchor="end">加好友</text>
  <line x1="34" y1="258" x2="326" y2="258" stroke="#F1F0EA"/>

  <circle cx="48" cy="290" r="17" fill="#E3E9D8"/>
