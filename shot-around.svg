  <text x="76" y="178" font-size="11.5" fill="#5E7A60">週末早上常打，平日晚上也可以</text>
  <text x="326" y="152" font-size="11.5" fill="#5C9A46" font-weight="800" text-anchor="end">加好友</text>
  <line x1="34" y1="196" x2="326" y2="196" stroke="#F1F0EA"/>

  <circle cx="48" cy="228" r="17" fill="#E3E9D8"/>
