<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 364" role="img" aria-label="地圖上每一支球隊的隊徽" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect x="4" y="4" width="352" height="356" rx="34" fill="#DEDACE"/>
  <rect x="8" y="8" width="344" height="348" rx="30" fill="#0F1A14"/>

  <!-- 底圖的路網示意 -->
  <g fill="none" stroke="#1E2C23" stroke-width="7" stroke-linecap="round">
    <path d="M30 120 L150 92 L330 150"/>
    <path d="M40 250 L180 210 L330 262"/>
    <path d="M120 40 L150 92 L132 200 L180 210 L200 340"/>
    <path d="M250 40 L264 128 L330 150"/>
  </g>

  <!-- 篩選片 -->
  <rect x="26" y="34" width="116" height="30" rx="15" fill="#D4AF37"/>
  <text x="84" y="54" font-size="12" fill="#1B1405" font-weight="800" text-anchor="middle">只看有球團</text>

  <!-- 球場 A：兩支隊 -->
  <g>
    <circle cx="150" cy="176" r="9" fill="#7AD66D" stroke="#0F1A14" stroke-width="2.5"/>
    <circle cx="135" cy="146" r="17" fill="#15291D" stroke="#D4AF37" stroke-width="2.5"/>
    <text x="135" y="152" font-size="14" text-anchor="middle">🎾</text>
    <circle cx="165" cy="146" r="17" fill="#15291D" stroke="#D4AF37" stroke-width="2.5"/>
    <text x="165" y="152" font-size="14" text-anchor="middle">🏸</text>
    <text x="150" y="200" font-size="11" fill="#E7EBEF" font-weight="700" text-anchor="middle">中路網球場</text>
  </g>

  <!-- 球場 B：一支隊 -->
  <g>
    <circle cx="264" cy="252" r="9" fill="#7AD66D" stroke="#0F1A14" stroke-width="2.5"/>
    <circle cx="264" cy="222" r="17" fill="#15291D" stroke="#D4AF37" stroke-width="2.5"/>
    <text x="264" y="228" font-size="14" text-anchor="middle">🌙</text>
    <text x="264" y="276" font-size="11" fill="#E7EBEF" font-weight="700" text-anchor="middle">河濱網球場</text>
  </g>

  <!-- 說明 -->
  <rect x="26" y="300" width="308" height="44" rx="14" fill="#15291D" stroke="#22382B"/>
  <text x="44" y="320" font-size="11.5" fill="#E7EBEF" font-weight="700">一座球場有幾支隊，就畫幾顆隊徽</text>
  <text x="44" y="337" font-size="10.5" fill="#9BA29B">點隊徽看成員與主場，可以直接加入</text>
</svg>
