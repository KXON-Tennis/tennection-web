<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>南北材質差異・橫式 1200×630 | Tennection</title>
  <style>
    :root {
      --bg: #0E1318; --line: rgba(255,255,255,.10);
      --clay: #FF6A3D; --hard: #4FA8FF;
      --ink: #F2F5F7; --ink2: #9FB0BD; --accent: #7ED957;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #05080b; display: block;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
    }
    /* 1200×630 橫式（LinkedIn/FB 連結預覽 / OG image） */
    .card {
      width: 1200px; height: 630px;
      background:
        radial-gradient(700px 420px at 82% -10%, rgba(79,168,255,.18), transparent 60%),
        radial-gradient(640px 440px at 6% 116%, rgba(255,106,61,.20), transparent 60%),
        var(--bg);
      color: var(--ink); padding: 44px 52px; display: flex; flex-direction: column;
      overflow: hidden;
    }
    .brand { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; }
    .brand .brand-icon { width: 38px; height: 38px; border-radius: 50%; display: block; }
    .brand .brand-wm { height: 30px; width: auto; display: block; }
    .brand .muted { color: var(--ink2); font-weight: 700; font-size: 19px; }

    .main { flex: 1 1 auto; display: flex; gap: 44px; align-items: center; padding: 6px 0; }
    .left { flex: 0 0 42%; }
    .right { flex: 1 1 auto; }

    .kicker { font-size: 21px; font-weight: 800; color: var(--ink2); letter-spacing: 1.5px; }
    h1 { margin-top: 8px; font-size: 66px; line-height: 1.04; font-weight: 900; letter-spacing: 1px; }
    h1 .hl { color: var(--clay); }
    .rankline { margin-top: 20px; font-size: 20px; font-weight: 800; color: var(--ink); line-height: 1.5; }
    .rankline .t { color: var(--clay); }
    .rankline b { color: var(--clay); }

    .bar-row { margin-bottom: 22px; }
    .bar-row:last-child { margin-bottom: 0; }
    .bar-row .lab { display: flex; align-items: baseline; gap: 12px; margin-bottom: 9px; }
    .bar-row .reg { font-size: 28px; font-weight: 900; }
    .bar-row .n { font-size: 17px; color: var(--ink2); font-weight: 700; }
    .track { height: 52px; border-radius: 12px; overflow: hidden; display: flex; background: #0a0e12; border: 1px solid var(--line); }
    .seg { height: 100%; display: flex; align-items: center; padding: 0 16px; font-weight: 900; font-size: 21px; color: #08121f; white-space: nowrap; }
    .seg.clay { background: linear-gradient(90deg, #FF7A4F, #FF5A29); color: #2a0d03; }
    .seg.hard { background: linear-gradient(90deg, #5FB0FF, #3E97F5); }

    .foot { flex: 0 0 auto; padding-top: 18px; border-top: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: center; }
    .foot .src { font-size: 18px; color: var(--ink2); }
    .foot .src b { color: var(--ink); }
    .foot .url { font-size: 22px; font-weight: 800; color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img class="brand-icon" src="/app-icon.png" alt="Tennis Nut" />
      <img class="brand-wm" src="/wordmark-white.png" alt="Tennis Nut" />
      <span class="muted">· 全台網球場資料</span>
    </div>

    <div class="main">
      <div class="left">
        <div class="kicker">台灣網球場・南北材質差異</div>
        <h1>越往南，<br /><span class="hl">紅土</span>越多</h1>
        <div class="rankline">🏆 <span class="t">紅土之都</span>：高雄 <b>64%</b> · 屏東 <b>~60%</b> · 台南 <b>39%</b></div>
      </div>
      <div class="right">
        <div class="bar-row">
          <div class="lab"><span class="reg">北部</span><span class="n">濁水溪以北 · 265 座</span></div>
          <div class="track">
            <div class="seg hard" style="width:91.7%">硬地 92%</div>
            <div class="seg clay" style="width:8.3%"></div>
          </div>
        </div>
        <div class="bar-row">
          <div class="lab"><span class="reg">南部</span><span class="n">濁水溪以南 · 194 座</span></div>
          <div class="track">
            <div class="seg hard" style="width:55.7%">硬地 56%</div>
            <div class="seg clay" style="width:43.8%">紅土 44%</div>
          </div>
        </div>
      </div>
    </div>

    <div class="foot">
      <div class="src">資料：全台 <b>450+ 座</b>・製作者十年人工蒐集，尚不完美</div>
      <div class="url">tennisnut.kxon.net/courts-map</div>
    </div>
  </div>
</body>
</html>
