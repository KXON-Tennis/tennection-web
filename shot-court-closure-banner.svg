<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect x="4" y="4" width="352" height="254" rx="30" fill="#DEDACE"/>
  <rect x="8" y="8" width="344" height="246" rx="26" fill="#FBFAF6"/>
  <rect x="158" y="24" width="44" height="4" rx="2" fill="#D8D5CB"/>
  <text x="24" y="62" font-size="17" fill="#1B5138" font-weight="800" text-anchor="start">中路運動公園網球場</text>
  <rect x="24" y="80" width="312" height="112" rx="14" fill="#FFF0F0" stroke="#F2B8B5" stroke-width="1.2"/>
  <text x="40" y="108" font-size="15" fill="#C92A2A" font-weight="800" text-anchor="start">🔒 維修中・至 11/15</text>
  <text x="40" y="132" font-size="12.5" fill="#8F2D2D" font-weight="600" text-anchor="start">這段期間不能在這裡約球</text>
  <rect x="40" y="146" width="132" height="34" rx="17" fill="#FFFFFF" stroke="#1B5138" stroke-width="1.4"/>
  <text x="106" y="168" font-size="13" fill="#1B5138" font-weight="700" text-anchor="middle">其實開著</text>
  <rect x="184" y="146" width="136" height="34" rx="17" fill="#FFFFFF" stroke="#C92A2A" stroke-width="1.4"/>
  <text x="252" y="168" font-size="13" fill="#C92A2A" font-weight="700" text-anchor="middle">還是封閉</text>
  <circle cx="336" cy="162" r="13" fill="#E8590C"/>
  <text x="336" y="167" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle">1</text>
  <text x="24" y="222" font-size="11.5" fill="#6E776F" font-weight="400" text-anchor="start">人在現場時按：「其實開著」會改回只顯示提醒；</text>
  <text x="24" y="242" font-size="11.5" fill="#6E776F" font-weight="400" text-anchor="start">「還是封閉」是幫這段期間做確認。</text>
</svg>
