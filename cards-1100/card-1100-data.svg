<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1080" height="1080" fill="#FBFAF6"/>
  <rect width="1080" height="14" fill="#1B5138"/>

  <text x="80" y="170" font-size="72" font-weight="800" fill="#1B5138">球場資料貢獻者</text>
  <text x="80" y="228" font-size="34" fill="#6E776F">球場資料是誰補齊的，寫在卡片上</text>

  <rect x="80" y="286" width="920" height="450" rx="34" fill="#FFFFFF" stroke="#ECEAE2" stroke-width="2"/>

  <text x="128" y="360" font-size="42" fill="#1B5138" font-weight="800">中央大學網球場</text>
  <text x="128" y="404" font-size="27" fill="#9BA29B">桃園市中壢區</text>

  <rect x="128" y="432" width="180" height="60" rx="18" fill="#ECEAE2"/>
  <text x="218" y="472" font-size="27" fill="#6E776F" font-weight="600" text-anchor="middle">7 面球場</text>
  <rect x="322" y="432" width="132" height="60" rx="18" fill="#ECEAE2"/>
  <text x="388" y="472" font-size="27" fill="#6E776F" font-weight="600" text-anchor="middle">硬地</text>
  <rect x="468" y="432" width="180" height="60" rx="18" fill="#ECEAE2"/>
  <text x="558" y="472" font-size="27" fill="#6E776F" font-weight="600" text-anchor="middle">免費開放</text>

  <line x1="128" y1="534" x2="952" y2="534" stroke="#F1F0EA" stroke-width="2"/>

  <text x="128" y="596" font-size="32">✅</text>
  <text x="182" y="596" font-size="30" fill="#3C6E3F" font-weight="700">現場驗證 · 21 小時前</text>
  <text x="952" y="596" font-size="27" fill="#9BA29B" text-anchor="end">4 位球友確認過</text>

  <text x="128" y="676" font-size="32">📝</text>
  <text x="182" y="676" font-size="31" fill="#5E7A60">資料由 <tspan font-weight="800" fill="#2E5A34">張大維</tspan>、<tspan font-weight="800" fill="#2E5A34">小葉</tspan>、<tspan font-weight="800" fill="#2E5A34">Ray Lin</tspan> 補上</text>

  <rect x="80" y="770" width="920" height="140" rx="30" fill="#F3F8EC"/>
  <text x="128" y="830" font-size="34" fill="#3C6E3F" font-weight="700">名稱、材質、面數、燈光、營業時間——</text>
  <text x="128" y="878" font-size="34" fill="#3C6E3F" font-weight="700">都是球友一筆一筆補起來的 🙏</text>
  <text x="540" y="1012" font-size="32" text-anchor="middle" fill="#9BA29B">Your tennis life, <tspan fill="#1B5138" font-weight="800">connected.</tspan></text>
</svg>
