<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect x="4" y="4" width="352" height="302" rx="30" fill="#DEDACE"/>
  <rect x="8" y="8" width="344" height="294" rx="26" fill="#FBFAF6"/>
  <text x="180" y="42" font-size="15" fill="#1B5138" font-weight="800" text-anchor="middle">我的諮詢</text>
  <text x="24" y="76" font-size="11.5" fill="#9BA29B">選一種專家</text>
  <g font-size="12" font-weight="700">
    <rect x="24" y="88" width="150" height="40" rx="10" fill="#3F7C43"/>
    <text x="99" y="113" fill="#FFFFFF" text-anchor="middle">網球技術</text>
    <rect x="186" y="88" width="150" height="40" rx="10" fill="none" stroke="#C9C5B8"/>
    <text x="261" y="113" fill="#1B5138" text-anchor="middle">網球體能</text>
    <rect x="24" y="136" width="150" height="40" rx="10" fill="none" stroke="#C9C5B8"/>
    <text x="99" y="161" fill="#1B5138" text-anchor="middle">物理治療</text>
    <rect x="186" y="136" width="150" height="40" rx="10" fill="none" stroke="#C9C5B8"/>
    <text x="261" y="161" fill="#1B5138" text-anchor="middle">運動營養</text>
  </g>
  <circle cx="99" cy="108" r="30" fill="none" stroke="#E8590C" stroke-width="3"/>
  <circle cx="70" cy="88" r="13" fill="#E8590C"/>
  <text x="70" y="93" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle">1</text>
  <rect x="24" y="196" width="312" height="58" rx="12" fill="#FFFFFF" stroke="#ECEAE2"/>
  <text x="40" y="220" font-size="12.5" fill="#9BA29B">正手打久了手肘會痛，是動作的問題嗎？</text>
  <text x="40" y="242" font-size="11.5" fill="#C9C5B8">照片、影片、球場紀錄都可以一起帶上</text>
  <circle cx="24" cy="196" r="13" fill="#E8590C"/>
  <text x="24" y="201" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle">2</text>
  <text x="24" y="284" font-size="12" fill="#6E776F">回覆之後想追問、補充、確認，全部不再收費。</text>
</svg>
