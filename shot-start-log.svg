<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect x="4" y="4" width="352" height="332" rx="30" fill="#DEDACE"/>
  <rect x="8" y="8" width="344" height="324" rx="26" fill="#FBFAF6"/>
  <rect x="158" y="24" width="44" height="4" rx="2" fill="#D8D5CB"/>
  <text x="24" y="60" font-size="16" fill="#1B5138" font-weight="800">記錄練習</text>
  <text x="24" y="90" font-size="11" fill="#9BA29B">球場（必填）</text>
  <rect x="24" y="98" width="312" height="42" rx="10" fill="#FFFFFF" stroke="#E8590C" stroke-width="2"/>
  <text x="40" y="124" font-size="13.5" fill="#1B5138" font-weight="700">桃園市中路網球場</text>
  <circle cx="24" cy="98" r="13" fill="#E8590C"/>
  <text x="24" y="103" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle">1</text>
  <text x="336" y="90" font-size="11" fill="#E8590C" font-weight="800" text-anchor="end">只有這一格是必填</text>
  <text x="24" y="166" font-size="11" fill="#9BA29B">時長</text>
  <rect x="24" y="174" width="312" height="8" rx="4" fill="#ECEAE2"/>
  <rect x="24" y="174" width="104" height="8" rx="4" fill="#3F7C43"/>
  <circle cx="128" cy="178" r="10" fill="#3F7C43"/>
  <text x="336" y="170" font-size="12" fill="#1B5138" font-weight="700" text-anchor="end">60 分鐘</text>
  <text x="24" y="212" font-size="11" fill="#9BA29B">練習重點（點一下就加進筆記）</text>
  <g font-size="11.5" font-weight="600">
    <rect x="24" y="222" width="52" height="26" rx="13" fill="#EDF3EA"/><text x="50" y="239" fill="#3F7C43" text-anchor="middle">發球</text>
    <rect x="82" y="222" width="52" height="26" rx="13" fill="#3F7C43"/><text x="108" y="239" fill="#FFFFFF" text-anchor="middle">正手</text>
    <rect x="140" y="222" width="52" height="26" rx="13" fill="#EDF3EA"/><text x="166" y="239" fill="#3F7C43" text-anchor="middle">反手</text>
    <rect x="198" y="222" width="52" height="26" rx="13" fill="#EDF3EA"/><text x="224" y="239" fill="#3F7C43" text-anchor="middle">截擊</text>
    <rect x="256" y="222" width="52" height="26" rx="13" fill="#EDF3EA"/><text x="282" y="239" fill="#3F7C43" text-anchor="middle">腳步</text>
  </g>
  <text x="24" y="280" font-size="11" fill="#9BA29B">這次練習感覺如何</text>
  <g>
    <circle cx="36" cy="298" r="9" fill="#C6FF3C"/><circle cx="62" cy="298" r="9" fill="#C6FF3C"/>
    <circle cx="88" cy="298" r="9" fill="#C6FF3C"/>
    <circle cx="114" cy="298" r="9" fill="none" stroke="#C9C5B8" stroke-width="1.6"/>
    <circle cx="140" cy="298" r="9" fill="none" stroke="#C9C5B8" stroke-width="1.6"/>
  </g>
  <text x="336" y="303" font-size="11" fill="#6E776F" text-anchor="end">給低分會幫你把問題整理好</text>
</svg>
