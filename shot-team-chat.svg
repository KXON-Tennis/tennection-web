<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect x="4" y="4" width="352" height="392" rx="34" fill="#DEDACE"/>
  <rect x="8" y="8" width="344" height="384" rx="30" fill="#FBFAF6"/>
  <rect x="154" y="20" width="52" height="5" rx="2.5" fill="#C9C5B8"/>

  <text x="28" y="62" font-size="17" fill="#1B5138" font-weight="800">球隊對話</text>
  <text x="332" y="62" font-size="12" fill="#9BA29B" text-anchor="end">週末早鳥隊</text>
  <line x1="16" y1="78" x2="344" y2="78" stroke="#ECEAE2"/>

  <rect x="104" y="94" width="152" height="24" rx="12" fill="#F1F0EA"/>
  <text x="180" y="110" font-size="11.5" fill="#6E776F" text-anchor="middle">小葉 加入了球隊</text>

  <circle cx="38" cy="148" r="13" fill="#E3E9D8"/>
  <text x="38" y="153" font-size="11" fill="#3F7C43" font-weight="800" text-anchor="middle">阿</text>
  <text x="60" y="140" font-size="11" fill="#9BA29B">阿凱</text>
  <rect x="58" y="146" width="210" height="34" rx="14" fill="#FFFFFF" stroke="#ECEAE2"/>
  <text x="72" y="168" font-size="13" fill="#2E5A34">這週六早上誰要來？</text>

  <circle cx="38" cy="212" r="13" fill="#E3E9D8"/>
  <text x="38" y="217" font-size="11" fill="#3F7C43" font-weight="800" text-anchor="middle">A</text>
  <text x="60" y="204" font-size="11" fill="#9BA29B">Amy Chen</text>
  <rect x="58" y="210" width="236" height="34" rx="14" fill="#FFFFFF" stroke="#ECEAE2"/>
  <text x="72" y="232" font-size="13" fill="#2E5A34">我 +1，我帶一筒新球</text>

  <rect x="128" y="262" width="200" height="34" rx="14" fill="#3F7C43"/>
  <text x="142" y="284" font-size="13" fill="#FFFFFF">8 點青年公園，老位置見</text>

  <rect x="16" y="330" width="328" height="44" rx="22" fill="#FFFFFF" stroke="#ECEAE2"/>
  <text x="36" y="357" font-size="13" fill="#B7BCB3">跟隊友說點什麼</text>
  <circle cx="320" cy="352" r="14" fill="#3F7C43"/>
  <path d="M314 352 h11 m-4 -4 l4 4 l-4 4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="180" y="429" font-size="13" text-anchor="middle" fill="#9BA29B" letter-spacing="0.2">Your tennis life, <tspan fill="#1B5138" font-weight="800">connected.</tspan></text>
</svg>
