<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect x="4" y="4" width="352" height="322" rx="34" fill="#DEDACE"/>
