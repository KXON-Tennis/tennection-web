<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1080" height="1080" fill="#FBFAF6"/>
  <rect width="1080" height="14" fill="#1B5138"/>
  <text x="80" y="170" font-size="72" font-weight="800" fill="#1B5138">這一帶有誰有空</text>
  <text x="80" y="228" font-size="34" fill="#6E776F">還不是好友的人，也約得到</text>

  <rect x="80" y="286" width="920" height="270" rx="34" fill="#FFFFFF" stroke="#ECEAE2" stroke-width="2"/>
  <circle cx="150" cy="360" r="34" fill="#E7F1E1"/>
  <text x="150" y="374" font-size="32" text-anchor="middle" fill="#3F7C43">阿</text>
  <text x="212" y="352" font-size="34" font-weight="800" fill="#1B5138">阿凱</text>
  <text x="212" y="398" font-size="29" fill="#5E7A60">9/26 (五) 19:00–21:00 有空</text>
  <text x="212" y="444" font-size="27" fill="#9BA29B">NTRP 3.5 · 下班後想打雙打，新手也歡迎</text>
  <rect x="800" y="330" width="150" height="58" rx="16" fill="#3F7C43"/>
  <text x="875" y="368" font-size="27" font-weight="800" fill="#FFFFFF" text-anchor="middle">約他</text>
  <text x="128" y="512" font-size="27" fill="#9BA29B">程度和自我介紹就在旁邊——要不要約，看這一兩句</text>

  <rect x="80" y="590" width="920" height="170" rx="34" fill="#F3F8EC" stroke="#DCE8C8" stroke-width="2"/>
  <text x="128" y="652" font-size="27" fill="#7C9A6E">他收到的是</text>
  <text x="128" y="714" font-size="36" font-weight="800" fill="#2E5A34">「你約他」，不是一則公告</text>

  <rect x="80" y="794" width="920" height="110" rx="30" fill="#FFFFFF" stroke="#ECEAE2" stroke-width="2"/>
  <text x="128" y="848" font-size="30" fill="#5E7A60">留一筆練習紀錄，這份名單就會開始出現。</text>
  <text x="128" y="888" font-size="30" fill="#5E7A60">不用多做什麼，打球本來就會留下。</text>

  <text x="540" y="1012" font-size="32" text-anchor="middle" fill="#9BA29B">Your tennis life, <tspan fill="#1B5138" font-weight="800">connected.</tspan></text>
</svg>
