<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1080" height="1080" fill="#FBFAF6"/>
  <rect width="1080" height="14" fill="#1B5138"/>
  <text x="80" y="170" font-size="72" font-weight="800" fill="#1B5138">看整週，改成條列</text>
  <text x="80" y="228" font-size="34" fill="#6E776F">你要的是誰和什麼時候，那是一份名單</text>

  <rect x="80" y="286" width="440" height="330" rx="34" fill="#FFFFFF" stroke="#ECEAE2" stroke-width="2"/>
  <text x="124" y="348" font-size="27" fill="#B7BFB6">以前</text>
  <text x="124" y="404" font-size="33" fill="#5E7A60">一打開是日曆</text>
  <g stroke="#ECEAE2" stroke-width="2" fill="#FAF9F5">
    <rect x="124" y="436" width="52" height="132" rx="8"/>
    <rect x="186" y="436" width="52" height="132" rx="8"/>
    <rect x="248" y="436" width="52" height="132" rx="8"/>
    <rect x="310" y="436" width="52" height="132" rx="8"/>
    <rect x="372" y="436" width="52" height="132" rx="8"/>
  </g>
  <rect x="190" y="470" width="44" height="34" rx="6" fill="#DDE7D5"/>
  <text x="124" y="596" font-size="25" fill="#9BA29B">三段重疊就讀不出名字</text>

  <rect x="560" y="286" width="440" height="330" rx="34" fill="#F3F8EC" stroke="#DCE8C8" stroke-width="2"/>
  <text x="604" y="348" font-size="27" fill="#7C9A6E">現在</text>
  <text x="604" y="404" font-size="33" fill="#2E5A34">一打開是名單</text>
  <rect x="604" y="432" width="352" height="52" rx="12" fill="#FFFFFF" stroke="#E3EDD8" stroke-width="2"/>
  <text x="626" y="465" font-size="25" fill="#2E5A34">阿凱 · 9/26 (五) 19:00</text>
  <rect x="604" y="494" width="352" height="52" rx="12" fill="#FFFFFF" stroke="#E3EDD8" stroke-width="2"/>
  <text x="626" y="527" font-size="25" fill="#2E5A34">小美 · 9/27 (六) 06:00</text>
  <text x="604" y="596" font-size="25" fill="#7C9A6E">幾個人有空都列得下</text>

  <rect x="80" y="650" width="920" height="110" rx="30" fill="#FFFFFF" stroke="#ECEAE2" stroke-width="2"/>
  <text x="128" y="704" font-size="30" fill="#5E7A60">日曆沒有消失，在右上角一鍵切回去。</text>
  <text x="128" y="744" font-size="30" fill="#5E7A60">想看誰跟誰的時間重疊，那張格子還是最清楚的。</text>

  <rect x="80" y="790" width="920" height="96" rx="30" fill="#F3F8EC" stroke="#DCE8C8" stroke-width="2"/>
  <text x="128" y="848" font-size="30" fill="#2E5A34">而且預設顯示全部的人，不再只有好友。</text>

  <text x="540" y="1012" font-size="32" text-anchor="middle" fill="#9BA29B">Your tennis life, <tspan fill="#1B5138" font-weight="800">connected.</tspan></text>
</svg>
