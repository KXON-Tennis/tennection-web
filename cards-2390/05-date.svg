<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1080" height="1080" fill="#FBFAF6"/>
  <rect width="1080" height="14" fill="#1B5138"/>
  <text x="80" y="170" font-size="72" font-weight="800" fill="#1B5138">哪一個週四？</text>
  <text x="80" y="228" font-size="34" fill="#6E776F">一個要自己換算的標籤，還沒說完話</text>

  <rect x="80" y="300" width="920" height="180" rx="34" fill="#FFFFFF" stroke="#ECEAE2" stroke-width="2"/>
  <text x="128" y="364" font-size="27" fill="#B7BFB6">以前</text>
  <text x="128" y="436" font-size="46" fill="#9BA29B">週四 有空</text>

  <rect x="80" y="512" width="920" height="180" rx="34" fill="#F3F8EC" stroke="#DCE8C8" stroke-width="2"/>
  <text x="128" y="576" font-size="27" fill="#7C9A6E">現在</text>
  <text x="128" y="648" font-size="46" font-weight="800" fill="#2E5A34">9/25 (四) 有空</text>

  <rect x="80" y="730" width="920" height="150" rx="30" fill="#FFFFFF" stroke="#ECEAE2" stroke-width="2"/>
  <text x="128" y="790" font-size="31" fill="#5E7A60">今天和明天維持原本的用字——</text>
  <text x="128" y="838" font-size="31" fill="#5E7A60">那兩個本來就不會搞錯。</text>

  <text x="540" y="1012" font-size="32" text-anchor="middle" fill="#9BA29B">Your tennis life, <tspan fill="#1B5138" font-weight="800">connected.</tspan></text>
</svg>
