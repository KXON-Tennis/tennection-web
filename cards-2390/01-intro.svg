  <text x="80" y="300" font-size="76" font-weight="800" fill="#1B5138">這一帶有誰有空</text>
  <text x="80" y="366" font-size="34" fill="#6E776F">以前只能看，現在約得到了</text>

  <rect x="80" y="430" width="920" height="92" rx="26" fill="#FFFFFF" stroke="#ECEAE2" stroke-width="2"/>
  <text x="124" y="488" font-size="34">👋</text>
  <text x="184" y="488" font-size="33" fill="#2E3A31">這一帶有空的球友，按「約他」就約得到</text>

  <rect x="80" y="540" width="920" height="92" rx="26" fill="#FFFFFF" stroke="#ECEAE2" stroke-width="2"/>
