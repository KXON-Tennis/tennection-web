<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1080" height="1080" fill="#FBFAF6"/>
  <rect width="1080" height="14" fill="#1B5138"/>
  <text x="80" y="170" font-size="72" font-weight="800" fill="#1B5138">全體球友的足跡</text>
  <text x="80" y="228" font-size="34" fill="#6E776F">每留一筆紀錄，地圖就亮一點</text>

  <rect x="80" y="286" width="920" height="420" rx="34" fill="#16301F"/>
  <g opacity="0.5" fill="#2A5638">
    <rect x="300" y="330" width="120" height="90" rx="14"/>
    <rect x="300" y="428" width="120" height="120" rx="14"/>
    <rect x="428" y="380" width="110" height="150" rx="14"/>
    <rect x="300" y="556" width="150" height="120" rx="14"/>
  </g>
  <g fill="#D8E64A">
    <circle cx="352" cy="372" r="11"/><circle cx="392" cy="466" r="11"/>
    <circle cx="336" cy="512" r="11"/><circle cx="470" cy="432" r="11"/>
    <circle cx="500" cy="500" r="11"/><circle cx="360" cy="600" r="11"/>
    <circle cx="410" cy="640" r="11"/>
  </g>
  <g fill="#7FC08E" opacity="0.9">
    <circle cx="452" cy="352" r="8"/><circle cx="318" cy="440" r="8"/>
    <circle cx="512" cy="392" r="8"/><circle cx="438" cy="596" r="8"/>
  </g>
  <text x="620" y="400" font-size="34" fill="#A9C7B4">球場</text>
  <text x="620" y="456" font-size="60" font-weight="800" fill="#FFFFFF">11,500+</text>
  <text x="620" y="530" font-size="34" fill="#A9C7B4">你貢獻了其中</text>
  <text x="620" y="596" font-size="60" font-weight="800" fill="#D8E64A">12 座</text>
  <text x="620" y="660" font-size="28" fill="#8FAF9B">拿下的縣市會整片點亮</text>

  <rect x="80" y="740" width="920" height="140" rx="30" fill="#FFFFFF" stroke="#ECEAE2" stroke-width="2"/>
  <text x="128" y="800" font-size="31" fill="#5E7A60">入口在護照的「球場征服」。</text>
  <text x="128" y="848" font-size="31" fill="#5E7A60">球場頁面也會顯示有幾位球友在這裡打過。</text>

  <text x="540" y="1012" font-size="32" text-anchor="middle" fill="#9BA29B">Your tennis life, <tspan fill="#1B5138" font-weight="800">connected.</tspan></text>
</svg>
