<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="680" height="240" fill="#FBFAF6"/>
  <line x1="80" y1="120" x2="600" y2="120" stroke="#ECEAE2" stroke-width="4"/>
  <line x1="80" y1="120" x2="427" y2="120" stroke="#00695F" stroke-width="4" opacity="0.35"/>
  <line x1="427" y1="120" x2="600" y2="120" stroke="#00695F" stroke-width="4"/>
  <circle cx="80" cy="120" r="12" fill="#9BA29B" stroke="#FBFAF6" stroke-width="4"/>
  <text x="80" y="88" font-size="16" fill="#007C72" font-weight="800" text-anchor="middle">走進球場</text>
  <text x="80" y="160" font-size="13" fill="#6E776F" font-weight="500" text-anchor="middle">GPS 偵測到你</text>
  <text x="80" y="180" font-size="13" fill="#6E776F" font-weight="500" text-anchor="middle">在 200 公尺內</text>
  <circle cx="253" cy="120" r="12" fill="#9BA29B" stroke="#FBFAF6" stroke-width="4"/>
  <text x="253" y="88" font-size="16" fill="#007C72" font-weight="800" text-anchor="middle">待滿 5 分鐘</text>
  <text x="253" y="160" font-size="13" fill="#6E776F" font-weight="500" text-anchor="middle">App 問你</text>
  <text x="253" y="180" font-size="13" fill="#6E776F" font-weight="500" text-anchor="middle">「你在 X 打球嗎？」</text>
  <circle cx="427" cy="120" r="12" fill="#00695F" stroke="#FBFAF6" stroke-width="4"/>
  <text x="427" y="88" font-size="16" fill="#007C72" font-weight="800" text-anchor="middle">按「確定」或記一筆</text>
  <text x="427" y="160" font-size="13" fill="#6E776F" font-weight="500" text-anchor="middle">這一刻才算你到場</text>
  <text x="427" y="180" font-size="13" fill="#6E776F" font-weight="500" text-anchor="middle">地圖上那座球場 +1</text>
  <circle cx="600" cy="120" r="12" fill="#9BA29B" stroke="#FBFAF6" stroke-width="4"/>
  <text x="600" y="88" font-size="16" fill="#007C72" font-weight="800" text-anchor="middle">兩小時後</text>
  <text x="600" y="160" font-size="13" fill="#6E776F" font-weight="500" text-anchor="middle">自動消失</text>
  <text x="600" y="180" font-size="13" fill="#6E776F" font-weight="500" text-anchor="middle">不必簽退</text>
  <text x="340" y="216" font-size="13" fill="#6E776F" font-weight="600" text-anchor="middle">只是待著不會算——要你按「確定」、或記一筆練習或比賽，才算來打球</text>
</svg>
