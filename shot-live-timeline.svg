<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="680" height="240" fill="#FBFAF6"/>
  <line x1="80" y1="120" x2="600" y2="120" stroke="#ECEAE2" stroke-width="4"/>
  <line x1="80" y1="120" x2="340.0" y2="120" stroke="#3F7C43" stroke-width="4" opacity="0.35"/>
  <line x1="340.0" y1="120" x2="600" y2="120" stroke="#3F7C43" stroke-width="4"/>
  <circle cx="80" cy="120" r="12" fill="#9BA29B" stroke="#FBFAF6" stroke-width="4"/>
  <text x="80" y="88" font-size="16" fill="#1B5138" font-weight="800" text-anchor="middle">走進球場</text>
  <text x="80" y="160" font-size="13" fill="#6E776F" font-weight="500" text-anchor="middle">GPS 偵測到你</text>
  <text x="80" y="180" font-size="13" fill="#6E776F" font-weight="500" text-anchor="middle">在 200 公尺內</text>
  <circle cx="340.0" cy="120" r="12" fill="#3F7C43" stroke="#FBFAF6" stroke-width="4"/>
  <text x="340.0" y="88" font-size="16" fill="#1B5138" font-weight="800" text-anchor="middle">待滿 5 分鐘</text>
  <text x="340.0" y="160" font-size="13" fill="#6E776F" font-weight="500" text-anchor="middle">這一刻算你到場</text>
  <text x="340.0" y="180" font-size="13" fill="#6E776F" font-weight="500" text-anchor="middle">地圖上那座球場 +1</text>
  <circle cx="600" cy="120" r="12" fill="#9BA29B" stroke="#FBFAF6" stroke-width="4"/>
  <text x="600" y="88" font-size="16" fill="#1B5138" font-weight="800" text-anchor="middle">兩小時後</text>
  <text x="600" y="160" font-size="13" fill="#6E776F" font-weight="500" text-anchor="middle">自動消失</text>
  <text x="600" y="180" font-size="13" fill="#6E776F" font-weight="500" text-anchor="middle">不必簽退</text>
  <text x="340.0" y="216" font-size="13" fill="#6E776F" font-weight="600" text-anchor="middle">路過不會算——這五分鐘就是為了把「經過」和「來打球」分開</text>
</svg>
