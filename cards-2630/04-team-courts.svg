<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1080" height="1080" fill="#FBFAF6"/>
  <rect width="1080" height="14" fill="#1B5138"/>
  <text x="80" y="170" font-size="72" font-weight="800" fill="#1B5138">全隊去過的球場</text>
  <text x="80" y="228" font-size="34" fill="#6E776F">一眼看出你們的主場在哪裡</text>
  <rect x="80" y="286" width="920" height="470" rx="34" fill="#FFFFFF" stroke="#ECEAE2" stroke-width="2"/>
  <text x="128" y="350" font-size="30" font-weight="800" fill="#1B5138">全隊去過的球場・18 座</text>
  <text x="128" y="412" font-size="28" fill="#2E3A31">華中橋下網球場</text>
  <rect x="560" y="388" width="280" height="28" rx="14" fill="#3F7C43" opacity="1.00"/>
  <text x="952" y="412" font-size="27" font-weight="800" fill="#1E5A2E" text-anchor="end">9 人</text>
  <text x="128" y="478" font-size="28" fill="#2E3A31">青年公園網球場</text>
  <rect x="560" y="454" width="123" height="28" rx="14" fill="#3F7C43" opacity="0.64"/>
  <text x="952" y="478" font-size="27" font-weight="800" fill="#1E5A2E" text-anchor="end">4 人</text>
  <text x="128" y="544" font-size="28" fill="#2E3A31">雙園河濱公園網球場</text>
  <rect x="560" y="520" width="123" height="28" rx="14" fill="#3F7C43" opacity="0.64"/>
  <text x="952" y="544" font-size="27" font-weight="800" fill="#1E5A2E" text-anchor="end">4 人</text>
  <text x="128" y="610" font-size="28" fill="#2E3A31">華中河濱公園網球場</text>
  <rect x="560" y="586" width="61" height="28" rx="14" fill="#3F7C43" opacity="0.49"/>
  <text x="952" y="610" font-size="27" font-weight="800" fill="#1E5A2E" text-anchor="end">2 人</text>
  <text x="128" y="676" font-size="28" fill="#2E3A31">永和綠寶石公園網球場</text>
  <rect x="560" y="652" width="61" height="28" rx="14" fill="#3F7C43" opacity="0.49"/>
  <text x="952" y="676" font-size="27" font-weight="800" fill="#1E5A2E" text-anchor="end">2 人</text>
  <rect x="80" y="786" width="920" height="150" rx="34" fill="#F3F8EC" stroke="#DCE8C8" stroke-width="2"/>
  <text x="128" y="846" font-size="27" fill="#7C9A6E">只顯示人數</text>
  <text x="128" y="902" font-size="36" font-weight="800" fill="#2E5A34">不顯示是誰、什麼時候去的</text>
  <text x="540" y="1012" font-size="32" text-anchor="middle" fill="#9BA29B">Your tennis life, <tspan fill="#1B5138" font-weight="800">connected.</tspan></text>
</svg>
