<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect x="4" y="4" width="352" height="292" rx="34" fill="#DEDACE"/>
  <rect x="8" y="8" width="344" height="284" rx="30" fill="#FBFAF6"/>
  <rect x="154" y="20" width="52" height="5" rx="2.5" fill="#C9C5B8"/>

  <text x="26" y="62" font-size="16" fill="#1B5138" font-weight="800">首頁</text>

  <rect x="16" y="80" width="328" height="128" rx="16" fill="#FFFFFF" stroke="#D8E64A" stroke-width="1.5"/>
  <text x="34" y="112" font-size="15">📌</text>
  <text x="58" y="112" font-size="14" fill="#2E5A34" font-weight="800">桃園市中路網球場 看起來是你的主場</text>
  <text x="34" y="136" font-size="11.5" fill="#6E776F">釘成主場之後，這座球場的狀況和今天誰在打，</text>
  <text x="34" y="153" font-size="11.5" fill="#6E776F">會直接出現在首頁。</text>

  <rect x="34" y="168" width="96" height="30" rx="8" fill="#F1F0EA"/>
  <text x="82" y="188" font-size="12.5" fill="#9BA29B" text-anchor="middle">不用了</text>
  <rect x="140" y="168" width="186" height="30" rx="8" fill="#D8E64A"/>
  <text x="233" y="188" font-size="12.5" fill="#2B3A2C" font-weight="800" text-anchor="middle">釘成主場</text>

  <rect x="16" y="224" width="328" height="52" rx="16" fill="#FFFFFF" stroke="#ECEAE2"/>
  <text x="34" y="248" font-size="12.5" fill="#2E5A34" font-weight="700">我的最愛球場</text>
  <text x="34" y="266" font-size="11" fill="#9BA29B">🔔 有狀況（客滿／溼滑／損壞）會即時通知你</text>
  <text x="180" y="329" font-size="13" text-anchor="middle" fill="#9BA29B" letter-spacing="0.2">Your tennis life, <tspan fill="#1B5138" font-weight="800">connected.</tspan></text>
</svg>
