<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"
     aria-label="Tennis Nut 1.26.0：約好的球可以改，球隊有了自己的聊天室" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="630" fill="#FBFAF6"/>
  <rect x="0" y="0" width="1200" height="8" fill="#1B5138"/>
  <text x="80" y="256" font-size="44" font-weight="800" fill="#1B5138">約好的球可以改</text>
  <text x="80" y="312" font-size="44" font-weight="800" fill="#3F7C43">球隊有了自己的聊天室</text>
  <text x="80" y="372" font-size="22" fill="#6E776F">加入球隊改成申請，看得到球友用什麼拍</text>
  <text x="80" y="440" font-size="20" fill="#9BA29B">Tennis Nut 1.26.0 · Build 2610</text>

  <!-- 右側：修改約球 -->
  <rect x="700" y="150" width="420" height="168" rx="26" fill="#FFFFFF" stroke="#ECEAE2" stroke-width="2"/>
  <text x="732" y="196" font-size="24" font-weight="800" fill="#1B5138">修改約球</text>
  <text x="732" y="228" font-size="17" fill="#9BA29B">青年公園網球場 · 10/12 (日) 08:00</text>
  <rect x="732" y="248" width="356" height="46" rx="13" fill="#F3F8EC"/>
  <text x="752" y="278" font-size="18" fill="#2E5A34">時間、內容、程度都能改</text>

  <!-- 右側：球隊對話 -->
  <rect x="700" y="340" width="420" height="156" rx="26" fill="#FFFFFF" stroke="#ECEAE2" stroke-width="2"/>
  <text x="732" y="384" font-size="20" font-weight="800" fill="#1B5138">球隊對話</text>
  <rect x="732" y="398" width="236" height="40" rx="16" fill="#F1F0EA"/>
  <text x="750" y="425" font-size="17" fill="#2E5A34">這週六早上誰要來？</text>
  <rect x="890" y="444" width="198" height="40" rx="16" fill="#3F7C43"/>
  <text x="908" y="471" font-size="17" fill="#FFFFFF">我 +1，我帶球</text>

  <text x="600" y="580" font-size="20" text-anchor="middle" fill="#9BA29B">Your tennis life, <tspan fill="#1B5138" font-weight="800">connected.</tspan></text>
</svg>
