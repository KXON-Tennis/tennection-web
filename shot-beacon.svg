  <circle cx="180" cy="196" r="52" fill="#D8E64A"/>
  <path d="M147 156 C168 182 168 210 147 236" fill="none" stroke="#FFFFFF"
        stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <path d="M213 156 C192 182 192 210 213 236" fill="none" stroke="#FFFFFF"
        stroke-width="4" stroke-linecap="round" opacity="0.9"/>
