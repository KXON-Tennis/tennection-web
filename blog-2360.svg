<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"
     aria-label="Tennis Nut 1.12.4：約球可以取消了" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="630" fill="#FBFAF6"/>
  <rect x="0" y="0" width="1200" height="8" fill="#1B5138"/>
  <text x="80" y="270" font-size="44" font-weight="800" fill="#1B5138">約球可以取消了</text>
  <text x="80" y="330" font-size="22" fill="#6E776F">那顆灰圖示換成了一句話</text>
  <text x="80" y="404" font-size="20" fill="#9BA29B">Tennis Nut 1.12.4 · Build 2360</text>

  <!-- 右側：一列約球，取消鍵獨立一行，不跟時間擠同一條線 -->
  <rect x="740" y="176" width="380" height="188" rx="26" fill="#FFFFFF" stroke="#ECEAE2" stroke-width="2"/>
  <rect x="772" y="208" width="44" height="44" rx="13" fill="#EEF3D6"/>
  <text x="782" y="240" font-size="26">🗓</text>
  <text x="834" y="228" font-size="21" font-weight="800" fill="#1B5138">9/23 (三) 06:00</text>
  <text x="834" y="256" font-size="17" fill="#8B968C">你主揪 · 1 人要去</text>
  <rect x="772" y="280" width="316" height="1" fill="#F0EEE6"/>
  <rect x="948" y="300" width="140" height="44" rx="14" fill="#FDECEC" stroke="#E8B4B4" stroke-width="2"/>
  <text x="1018" y="329" font-size="20" font-weight="800" fill="#C0392B" text-anchor="middle">取消約球</text>
  <text x="772" y="329" font-size="17" fill="#B7BFB6">主揪看到的</text>

  <text x="80" y="560" font-size="21" fill="#9BA29B">Your tennis life, <tspan fill="#1B5138" font-weight="800">connected.</tspan></text>
</svg>
