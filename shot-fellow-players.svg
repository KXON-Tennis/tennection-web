<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect x="4" y="4" width="352" height="392" rx="34" fill="#DEDACE"/>
  <rect x="8" y="8" width="344" height="384" rx="30" fill="#FBFAF6"/>
  <rect x="154" y="20" width="52" height="5" rx="2.5" fill="#C9C5B8"/>

  <!-- 球場卡上那一行入口 -->
  <rect x="16" y="46" width="328" height="74" rx="16" fill="#FFFFFF" stroke="#ECEAE2"/>
  <circle cx="46" cy="83" r="13" fill="#E3E9D8" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="66" cy="83" r="13" fill="#D8E0CB" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="86" cy="83" r="13" fill="#C9D4BA" stroke="#FFFFFF" stroke-width="2"/>
  <text x="112" y="88" font-size="12.5" fill="#5E7A60" font-weight="600">另外 3 位球友也在這裡打過</text>
  <path d="M322 77 l7 6 l-7 6" fill="none" stroke="#9BA29B" stroke-width="2" stroke-linecap="round"/>

  <!-- 展開後的名單 -->
  <rect x="16" y="136" width="328" height="222" rx="18" fill="#FFFFFF" stroke="#ECEAE2"/>
  <text x="34" y="168" font-size="15" fill="#1B5138" font-weight="800">也在這裡打過的球友</text>

  <line x1="34" y1="186" x2="326" y2="186" stroke="#F1F0EA"/>
  <circle cx="52" cy="212" r="15" fill="#E3E9D8"/>
  <text x="52" y="217" font-size="12" fill="#3F7C43" font-weight="800" text-anchor="middle">林</text>
  <text x="78" y="217" font-size="13.5" fill="#2E5A34" font-weight="700">林家瑋</text>
  <text x="326" y="217" font-size="12.5" fill="#5C9A46" font-weight="800" text-anchor="end">加入好友</text>

  <line x1="34" y1="240" x2="326" y2="240" stroke="#F1F0EA"/>
  <circle cx="52" cy="266" r="15" fill="#E3E9D8"/>
  <text x="52" y="271" font-size="12" fill="#3F7C43" font-weight="800" text-anchor="middle">小</text>
  <text x="78" y="271" font-size="13.5" fill="#2E5A34" font-weight="700">小葉</text>
  <text x="326" y="271" font-size="12.5" fill="#5C9A46" font-weight="800" text-anchor="end">加入好友</text>

  <line x1="34" y1="294" x2="326" y2="294" stroke="#F1F0EA"/>
  <circle cx="52" cy="320" r="15" fill="#E3E9D8"/>
  <text x="52" y="325" font-size="12" fill="#3F7C43" font-weight="800" text-anchor="middle">A</text>
  <text x="78" y="325" font-size="13.5" fill="#2E5A34" font-weight="700">Amy Chen</text>
  <text x="326" y="325" font-size="12.5" fill="#9BA29B" font-weight="700" text-anchor="end">已送出</text>
  <text x="180" y="429" font-size="13" text-anchor="middle" fill="#9BA29B" letter-spacing="0.2">Your tennis life, <tspan fill="#1B5138" font-weight="800">connected.</tspan></text>
</svg>
