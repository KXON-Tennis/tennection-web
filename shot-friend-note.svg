<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 364" role="img" aria-label="送好友邀請時可以說一句話" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect x="4" y="4" width="352" height="356" rx="34" fill="#DEDACE"/>
  <rect x="8" y="8" width="344" height="348" rx="30" fill="#FBFAF6"/>
  <rect x="154" y="20" width="52" height="5" rx="2.5" fill="#C9C5B8"/>

  <text x="34" y="62" font-size="16" fill="#1B5138" font-weight="800">送出好友邀請</text>
  <line x1="34" y1="80" x2="326" y2="80" stroke="#ECEAE2"/>

  <rect x="34" y="98" width="292" height="66" rx="14" fill="#FFFFFF" stroke="#ECEAE2"/>
  <circle cx="68" cy="131" r="20" fill="#3F7C43" opacity="0.14"/>
  <text x="68" y="137" font-size="15" text-anchor="middle">🎾</text>
  <text x="100" y="126" font-size="14" fill="#1B5138" font-weight="800">小柔</text>
  <text x="100" y="146" font-size="11" fill="#6E776F">中階 · 球齡 3 年</text>

  <rect x="34" y="176" width="292" height="24" rx="12" fill="#EEF4EC"/>
  <text x="48" y="192" font-size="11" fill="#2F6B3C">你們都在中路網球場打過</text>

  <text x="34" y="226" font-size="11.5" fill="#6E776F" font-weight="700">說一句話（選填）</text>
  <rect x="34" y="236" width="292" height="62" rx="12" fill="#FFFFFF" stroke="#3F7C43"/>
  <text x="50" y="262" font-size="12.5" fill="#3B443C">上次在中路遇到，下次一起打？</text>
  <text x="310" y="290" font-size="10" fill="#9BA29B" text-anchor="end">15 / 60</text>

  <rect x="34" y="312" width="292" height="40" rx="20" fill="#3F7C43"/>
  <text x="180" y="337" font-size="13.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">送出邀請</text>
</svg>
