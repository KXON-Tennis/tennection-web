    <h1>Install</h1>
    <!-- ─────────── iOS ───────────
         The TestFlight walkthrough lived here: install TestFlight, accept an
         invite, tap Install, and a note that the build expires every 90 days.
         It is gone rather than hidden because a public page that still hands
         out a beta invite while the App Store review is running invites people
         onto a build that is about to be superseded, and TestFlight builds
         expire — a visitor who follows it in three weeks gets a dead link and
         no explanation.
    -->
    <section class="plat">
      <p class="as-badge-wrap">
        <a class="as-badge" href="https://apps.apple.com/app/id6761720650" target="_blank" rel="noopener" aria-label="Download Tennis Nut on the App Store">
          <img src="/app-store-badge-en.svg" alt="Download on the App Store" width="159" height="53" />
        </a>
        <a class="as-badge" href="https://play.google.com/store/apps/details?id=com.tns.passport" target="_blank" rel="noopener" aria-label="Get Tennis Nut on Google Play"><img src="/google-play-badge-en.png" alt="Get it on Google Play" width="178" height="53" /></a>
      </p>

    </section>
      <p class="small-note">Joined the Android test earlier? No need to reinstall — Google Play keeps updating it.</p>

    <!-- The 綁定 LINE section lived here: get a 6-digit code from Nutty, type
         it into 設定 → 綁定 LINE 帳號, and your 堅果 move across. The App has no
         such screen any more (the flow was used 3 times in 3 months and the
         last one carried 0 points), so the walkthrough would have sent people
         to a menu item that does not exist. LINE keeps its own 堅果; the two
         sides simply accumulate separately now. -->
