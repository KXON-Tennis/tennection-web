<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1080" height="1080" fill="#FBFAF6"/>
  <rect width="1080" height="14" fill="#1B5138"/>
  <text x="80" y="170" font-size="70" font-weight="800" fill="#1B5138">本週最熱的球場</text>
  <text x="80" y="228" font-size="34" fill="#6E776F">以到場打卡的人次計</text>

  <rect x="80" y="290" width="920" height="150" rx="32" fill="#1B5138"/>
  <text x="128" y="352" font-size="40" font-weight="800" fill="#FFFFFF">桃園市中路網球場</text>
  <text x="128" y="406" font-size="30" fill="#A9C7B4">23 次打卡 · 13 位不同的球友</text>
  <text x="952" y="382" font-size="64" text-anchor="end">🥇</text>

  <rect x="80" y="464" width="920" height="110" rx="28" fill="#FFFFFF" stroke="#ECEAE2" stroke-width="2"/>
  <text x="128" y="520" font-size="34" font-weight="700" fill="#1B5138">華中橋下網球場</text>
  <text x="952" y="520" font-size="30" fill="#6E776F" text-anchor="end">8 次 · 4 人</text>
  <text x="128" y="556" font-size="0" fill="#FFF">.</text>

  <rect x="80" y="592" width="920" height="110" rx="28" fill="#FFFFFF" stroke="#ECEAE2" stroke-width="2"/>
  <text x="128" y="648" font-size="34" font-weight="700" fill="#1B5138">新竹科學園區東區網球場</text>
  <text x="952" y="648" font-size="30" fill="#6E776F" text-anchor="end">5 次 · 2 人</text>

  <rect x="80" y="720" width="920" height="110" rx="28" fill="#FFFFFF" stroke="#ECEAE2" stroke-width="2"/>
  <text x="128" y="776" font-size="34" font-weight="700" fill="#1B5138">大同區迪化運動公園</text>
  <text x="952" y="776" font-size="30" fill="#6E776F" text-anchor="end">3 次 · 2 人</text>

  <text x="80" y="892" font-size="30" fill="#9BA29B">13 個人在同一座球場打過球——</text>
  <text x="80" y="936" font-size="30" fill="#9BA29B">那是能在球場上遇見彼此的密度。</text>

  <text x="540" y="1012" font-size="32" text-anchor="middle" fill="#9BA29B">Your tennis life, <tspan fill="#1B5138" font-weight="800">connected.</tspan></text>
</svg>
