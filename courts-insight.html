<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>南北材質差異・封面圖 | Tennection</title>
  <style>
    :root {
      --bg: #0E1318; --panel: #161C23; --line: rgba(255,255,255,.10);
      --clay: #FF6A3D; --hard: #4FA8FF; --grass: #7ED957;
      --ink: #F2F5F7; --ink2: #9FB0BD; --accent: #7ED957;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #05080b; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
      padding: 20px;
    }
    /* 1080×1080 匯出方框 */
    .card {
      width: 1080px; height: 1080px; flex: 0 0 auto;
      background:
        radial-gradient(900px 500px at 78% -8%, rgba(79,168,255,.16), transparent 60%),
        radial-gradient(800px 520px at 12% 112%, rgba(255,106,61,.18), transparent 60%),
        var(--bg);
      color: var(--ink); padding: 76px 80px 70px; display: flex; flex-direction: column;
      position: relative; overflow: hidden;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand .brand-icon { width: 46px; height: 46px; border-radius: 50%; display: block; flex: 0 0 auto; }
    .brand .brand-wm { height: 38px; width: auto; display: block; }
    .brand .muted { color: var(--ink2); font-weight: 700; font-size: 23px; }

    .kicker { margin-top: 54px; font-size: 30px; font-weight: 800; color: var(--ink2); letter-spacing: 2px; }
    h1 { margin-top: 10px; font-size: 92px; line-height: 1.04; font-weight: 900; letter-spacing: 1px; }
    h1 .hl { color: var(--clay); }

    .bars { margin-top: 64px; display: flex; flex-direction: column; gap: 34px; }
    .bar-row .lab { display: flex; align-items: baseline; gap: 14px; margin-bottom: 12px; }
    .bar-row .reg { font-size: 38px; font-weight: 900; }
    .bar-row .n { font-size: 22px; color: var(--ink2); font-weight: 700; }
    .track { height: 64px; border-radius: 14px; overflow: hidden; display: flex; background: #0a0e12; border: 1px solid var(--line); }
    .seg { height: 100%; display: flex; align-items: center; padding: 0 20px; font-weight: 900; font-size: 27px; color: #08121f; white-space: nowrap; }
    .seg.clay { background: linear-gradient(90deg, #FF7A4F, #FF5A29); color: #2a0d03; }
    .seg.hard { background: linear-gradient(90deg, #5FB0FF, #3E97F5); }
    .seg.other { background: #2b333c; color: var(--ink2); }

    .rank { margin-top: 56px; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 18px; padding: 26px 30px; }
    .rank .h { font-size: 26px; font-weight: 800; color: var(--clay); margin-bottom: 14px; }
    .rank .items { display: flex; gap: 14px; flex-wrap: wrap; }
    .chip { background: #1c242c; border: 1px solid var(--line); border-radius: 999px; padding: 12px 20px; font-size: 26px; font-weight: 800; }
    .chip b { color: var(--clay); }

    .foot { margin-top: auto; padding-top: 40px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-end; }
    .foot .src { font-size: 23px; color: var(--ink2); line-height: 1.5; }
    .foot .src b { color: var(--ink); }
    .foot .url { font-size: 26px; font-weight: 800; color: var(--accent); text-align: right; }
    .foot .url .small { display: block; font-size: 20px; color: var(--ink2); font-weight: 700; margin-top: 4px; }

    .hint { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); color: #7a8893; font-size: 13px; }
  </style>
</head>
<body>
  <div class="hint">↓ 截圖這張 1080×1080 方卡當貼文主圖（請用 Retina/100% 縮放截取）</div>
  <div class="card" id="card">
    <div class="brand">
      <img class="brand-icon" src="/app-icon.png" alt="Tennis Nut" />
      <img class="brand-wm" src="/wordmark-white.png" alt="Tennis Nut" />
      <span class="muted">· 全台網球場資料</span>
    </div>

    <div class="kicker">台灣網球場・南北材質差異</div>
    <h1>越往南，<br /><span class="hl">紅土</span>越多</h1>

    <div class="bars">
      <div class="bar-row">
        <div class="lab"><span class="reg">北部</span><span class="n">濁水溪以北 · 265 座</span></div>
        <div class="track">
          <div class="seg hard" style="width:91.7%">硬地 92%</div>
          <div class="seg clay" style="width:8.3%"></div>
        </div>
      </div>
      <div class="bar-row">
        <div class="lab"><span class="reg">南部</span><span class="n">濁水溪以南 · 194 座</span></div>
        <div class="track">
          <div class="seg hard" style="width:55.7%">硬地 56%</div>
          <div class="seg clay" style="width:43.8%">紅土 44%</div>
        </div>
      </div>
    </div>

    <div class="rank">
      <div class="h">🏆 紅土之都 — 各縣市紅土佔比</div>
      <div class="items">
        <span class="chip">高雄 <b>64%</b></span>
        <span class="chip">屏東 <b>~60%</b></span>
        <span class="chip">台南 <b>39%</b></span>
        <span class="chip">嘉義 <b>~30%</b></span>
        <span class="chip" style="opacity:.75">台北 <b>6.5%</b></span>
      </div>
    </div>

    <div class="foot">
      <div class="src">資料：全台 <b>459 座</b>球場<br />站長十年親手蒐集，尚不完美</div>
      <div class="url">tennisnut.kxon.net/courts-map<span class="small">🗺️ 互動地圖・加 LINE 一起補完</span></div>
    </div>
  </div>
</body>
</html>
