<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1080" height="1080" fill="#1B5138"/>
  <text x="80" y="300" font-size="34" fill="#A9C7B4">Tennis Nut 1.12.4</text>
  <text x="80" y="400" font-size="70" font-weight="800" fill="#FFFFFF">按下去之前</text>
  <text x="80" y="490" font-size="70" font-weight="800" fill="#D8E64A">先知道會發生什麼</text>

  <rect x="80" y="574" width="920" height="200" rx="34" fill="#164430"/>
  <text x="128" y="644" font-size="33" fill="#CFE0D4">這一版修的都是同一件事：一個沒有文字的</text>
  <text x="128" y="694" font-size="33" fill="#CFE0D4">圖示，跟一個按下去就回不來的動作。</text>
  <text x="128" y="744" font-size="33" fill="#CFE0D4">收回自己的決定，不該要先猜。</text>

