  <text x="80" y="920" font-size="31" fill="#A9C7B4">tennisnut.kxon.net</text>
  <text x="540" y="1012" font-size="32" text-anchor="middle" fill="#8FAF9B">Your tennis life, <tspan fill="#D8E64A" font-weight="800">connected.</tspan></text>
</svg>
