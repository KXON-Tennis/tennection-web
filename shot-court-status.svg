<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect x="4" y="4" width="352" height="492" rx="30" fill="#DEDACE"/>
  <rect x="8" y="8" width="344" height="484" rx="26" fill="#FBFAF6"/>
  <rect x="158" y="24" width="44" height="4" rx="2" fill="#D8D5CB"/>
  <text x="24" y="62" font-size="17" fill="#1B5138" font-weight="800" text-anchor="start">報告球場狀態</text>
  <text x="24" y="84" font-size="12" fill="#6E776F" font-weight="400" text-anchor="start">中路運動公園網球場</text>
  <rect x="24" y="100" width="150" height="64" rx="12" fill="#EAF3EC" stroke="#1B5138" stroke-width="1.8"/>
  <text x="38" y="126" font-size="13.5" fill="#1B5138" font-weight="800" text-anchor="start">即時狀態回報</text>
  <text x="38" y="148" font-size="11" fill="#6E776F" font-weight="400" text-anchor="start">溼滑、客滿、損壞…</text>
  <rect x="186" y="100" width="150" height="64" rx="12" fill="#FFFFFF" stroke="#D8D5CB" stroke-width="1.2"/>
  <text x="200" y="126" font-size="13.5" fill="#2B2F2C" font-weight="700" text-anchor="start">基本資訊勘誤</text>
  <text x="200" y="148" font-size="11" fill="#6E776F" font-weight="400" text-anchor="start">名稱、燈光、面數…</text>
  <circle cx="170" cy="100" r="13" fill="#E8590C"/>
  <text x="170" y="105" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle">1</text>
  <text x="24" y="196" font-size="12" fill="#6E776F" font-weight="700" text-anchor="start">目前球場狀態</text>
  <rect x="24" y="208" width="116" height="34" rx="17" fill="#EAF3EC" stroke="#1B5138" stroke-width="1.6"/>
  <text x="82.0" y="230" font-size="12.5" fill="#1B5138" font-weight="700" text-anchor="middle">✅ 可正常使用</text>
  <rect x="150" y="208" width="116" height="34" rx="17" fill="#FFFFFF" stroke="#D8D5CB" stroke-width="1.2"/>
  <text x="208.0" y="230" font-size="12.5" fill="#2B2F2C" font-weight="500" text-anchor="middle">💧 場地溼滑</text>
  <rect x="24" y="250" width="116" height="34" rx="17" fill="#FFFFFF" stroke="#D8D5CB" stroke-width="1.2"/>
  <text x="82.0" y="272" font-size="12.5" fill="#2B2F2C" font-weight="500" text-anchor="middle">⚠️ 設施損壞</text>
  <rect x="150" y="250" width="116" height="34" rx="17" fill="#FFFFFF" stroke="#D8D5CB" stroke-width="1.2"/>
  <text x="208.0" y="272" font-size="12.5" fill="#2B2F2C" font-weight="500" text-anchor="middle">🚫 場地客滿</text>
  <rect x="24" y="292" width="116" height="34" rx="17" fill="#FFFFFF" stroke="#D8D5CB" stroke-width="1.2"/>
  <text x="82.0" y="314" font-size="12.5" fill="#2B2F2C" font-weight="500" text-anchor="middle">🔒 暫停開放</text>
  <circle cx="280" cy="225" r="13" fill="#E8590C"/>
  <text x="280" y="230" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle">2</text>
  <rect x="24" y="360" width="312" height="44" rx="8" fill="#FFFFFF" stroke="#D8D5CB" stroke-width="1.2"/>
  <text x="36" y="354" font-size="11" fill="#6E776F" font-weight="600" text-anchor="start">補充說明（選填）</text>
  <text x="36" y="387" font-size="12" fill="#B5BAB3" font-weight="400" text-anchor="start">例如：只有 A 場積水，B 場可用</text>
  <rect x="24" y="420" width="312" height="40" rx="10" fill="#1B5138"/>
  <text x="180.0" y="445.0" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">提交回報 (+15 堅果)</text>
  <text x="180" y="480" font-size="11.5" fill="#9BA29B" font-weight="400" text-anchor="middle">需在球場 200m 範圍內才能回報</text>
  <circle cx="336" cy="438" r="13" fill="#E8590C"/>
  <text x="336" y="443" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle">3</text>
</svg>
