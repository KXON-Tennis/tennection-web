  <g stroke="#1B5138" stroke-width="1.9" fill="none" stroke-linecap="round">
    <circle cx="303" cy="34" r="6"/>
    <path d="M293 48 c0 -6 5 -9 10 -9 c3 0 6 1 8 3"/>
    <path d="M315 40 v11 M309.5 45.5 h11"/>
  </g>
  <circle cx="303" cy="40" r="24" fill="none" stroke="#3F7C43" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="303" y="82" font-size="11" fill="#3F7C43" font-weight="800" text-anchor="middle">加好友按這裡</text>

  <!-- 跳出來的視窗 -->
  <rect x="8" y="98" width="344" height="324" rx="24" fill="#FBFAF6"/>
  <rect x="158" y="110" width="44" height="4" rx="2" fill="#D8D5CB"/>
