<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect x="4" y="4" width="352" height="422" rx="30" fill="#DEDACE"/>
  <rect x="8" y="8" width="344" height="414" rx="26" fill="#EFEDE6"/>

  <!-- 好友頁的標題列，右上角那顆人＋圖示 -->
  <rect x="8" y="8" width="344" height="62" rx="26" fill="#FBFAF6"/>
