  <text x="336" y="144" font-size="13" fill="#3F7C43" text-anchor="end">關閉</text>
  <rect x="24" y="158" width="312" height="44" rx="10" fill="#FFFFFF" stroke="#3F7C43" stroke-width="1.6"/>
  <circle cx="46" cy="180" r="7" fill="none" stroke="#3F7C43" stroke-width="1.6"/>
  <line x1="51" y1="185" x2="56" y2="190" stroke="#3F7C43" stroke-width="1.6"/>
  <text x="66" y="186" font-size="14" fill="#1B5138" font-weight="700" letter-spacing="1">ABCD1234</text>
  <line x1="196" y1="168" x2="196" y2="192" stroke="#3F7C43" stroke-width="1.6"/>
  <circle cx="180" cy="180" r="30" fill="none" stroke="#3F7C43" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="236" y="186" font-size="11" fill="#3F7C43" font-weight="800">ID 貼這裡</text>
  <rect x="24" y="216" width="150" height="38" rx="9" fill="none" stroke="#C9C5B8"/>
  <text x="99" y="240" font-size="12.5" fill="#1B5138" font-weight="700" text-anchor="middle">我的 QR Code</text>
  <rect x="186" y="216" width="150" height="38" rx="9" fill="none" stroke="#C9C5B8"/>
  <text x="261" y="240" font-size="12.5" fill="#1B5138" font-weight="700" text-anchor="middle">掃描加好友</text>
  <rect x="24" y="272" width="312" height="72" rx="12" fill="#FFFFFF" stroke="#ECEAE2"/>
  <circle cx="60" cy="308" r="22" fill="#EDF3EA"/>
  <text x="60" y="315" font-size="17" fill="#3F7C43" font-weight="800" text-anchor="middle">王</text>
  <text x="94" y="302" font-size="15" fill="#1B5138" font-weight="800">王小明</text>
  <text x="94" y="324" font-size="12" fill="#9BA29B">ID · ABCD1234</text>
  <rect x="240" y="292" width="80" height="32" rx="8" fill="#3F7C43"/>
  <text x="280" y="313" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">加入好友</text>
  <circle cx="280" cy="308" r="26" fill="none" stroke="#3F7C43" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="24" y="374" font-size="12.5" fill="#6E776F">按下去就送出了，接著等對方按勾勾確認。</text>
