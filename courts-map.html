<head>

  <meta name="twitter:title" content="Tennis Nut 網球場地圖 — Tennis Court Map" />
  <meta name="twitter:description" content="Surface, floodlights, parking and player-confirmed details for courts across five markets." />
  <meta name="twitter:image" content="https://tennisnut.kxon.net/courts-insight-wide.png" />

  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

  <style>
    :root {
      --accent: #5C9A46;
      --accent-d: #3C6E3F;
      --clay: #FF6A3D; --hard: #4FA8FF; --grass: #7ED957; --other: #AEB6BD;
      --glass: rgba(16,21,27,.74);
      --glass-line: rgba(255,255,255,.12);
      --ink: #F2F5F7; --ink2: #AEBAC4; --ink3: #7C8B99;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
        "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
      background: #11151a; color: var(--ink); overflow: hidden;
    }

    /* ── 全版地圖 ── */
    #map { position: fixed; inset: 0; z-index: 0; background: #11151a; }
    /* Mapbox 控制項（右上）玻璃化 + 避開頂部面板由 CSS 位移 */
    .mapboxgl-ctrl-top-right { top: 14px; right: 14px; }
    /* Mapbox's terms require the wordmark and attribution to stay visible on
       this plan, so they are moved and dimmed rather than removed — bottom
       left, out of the corner the eye goes to, at low opacity until hovered. */
    .mapboxgl-ctrl-logo, .mapboxgl-ctrl-attrib { opacity: .35; transform: scale(.85);
      transform-origin: bottom left; transition: opacity .2s; }
    .mapboxgl-ctrl-logo:hover, .mapboxgl-ctrl-attrib:hover { opacity: .9; }
    /* Sits directly above the QR card, right-aligned with it. Laid out as a
       row so the stack stays short — the corner already holds the QR and the
       CTA bar. On mobile the QR is hidden, so it drops down to fill that gap. */
    .style-switch { position: fixed; right: 14px; z-index: 3;
      bottom: calc(298px + env(safe-area-inset-bottom));
      display: flex; gap: 2px; padding: 4px;
      border-radius: 12px; }
    .style-switch button { appearance: none; border: 0; background: transparent;
      color: #E7EBEF; font: inherit; font-size: 12px; font-weight: 600;
      padding: 6px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
    .style-switch button[aria-pressed="true"] { background: rgba(255,255,255,.16); }
    @media (max-width: 559px) { .style-switch { bottom: calc(150px + env(safe-area-inset-bottom)); } }
    .mapboxgl-ctrl-group { background: var(--glass) !important; backdrop-filter: blur(8px);
      border: 1px solid var(--glass-line); }
    .mapboxgl-ctrl-group button + button { border-top: 1px solid var(--glass-line); }
    .mapboxgl-ctrl-group button .mapboxgl-ctrl-icon { filter: invert(1) brightness(1.4); }
    .mapboxgl-ctrl-attrib { background: rgba(16,21,27,.6) !important; }
    .mapboxgl-ctrl-attrib a { color: var(--ink2) !important; }

    /* 上下漸層遮罩，讓浮層文字更清楚 */
    .scrim { position: fixed; left: 0; right: 0; z-index: 1; pointer-events: none; }
    .scrim.top { top: 0; height: 230px; background: linear-gradient(180deg, rgba(8,11,15,.72), transparent); }
    .scrim.bottom { bottom: 0; height: 220px; background: linear-gradient(0deg, rgba(8,11,15,.78), transparent); }

    /* 通用玻璃面板 */
    .glass {
      background: var(--glass); backdrop-filter: blur(10px);
      border: 1px solid var(--glass-line); border-radius: 16px;
      box-shadow: 0 10px 34px rgba(0,0,0,.40);
    }

    /* ── 頂部：標題 + 統計 + 圖例 ── */
    .top-panel {
      position: fixed; z-index: 3; top: 14px; left: 14px; width: min(440px, calc(100vw - 28px));
      padding: 15px 17px 14px;
    }
    .top-panel h1 { margin: 0; font-size: 21px; font-weight: 900; letter-spacing: .3px; line-height: 1.2; }
    .top-panel .sub { margin: 4px 0 0; font-size: 13px; color: var(--ink2); line-height: 1.5; }
    .stat-strip { display: flex; gap: 7px; margin-top: 12px; flex-wrap: wrap; }
    .stat { background: rgba(255,255,255,.07); border: 1px solid var(--glass-line); border-radius: 10px;
      padding: 6px 11px; font-size: 12px; color: var(--ink2); white-space: nowrap; }
    .stat b { color: var(--ink); font-size: 15px; }
    .legend-row { display: flex; gap: 13px; flex-wrap: wrap; margin-top: 13px;
      padding-top: 12px; border-top: 1px solid var(--glass-line); }
    .legend-row[hidden] { display: none; }
    .legend-row .it { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink2); }
    .legend-row .dot { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.85);
      box-shadow: 0 0 6px currentColor; flex: 0 0 auto; }
    .legend-row .cnt { color: var(--ink); font-weight: 800; font-variant-numeric: tabular-nums; }

    /* ── 球場詳細面板 ──
       On a wide screen it takes the top panel's slot rather than opening
       beside it: the title and the legend are what you read before you have
       picked anywhere, and a court is what you read after. Same position and
       width, so nothing moves and there is nothing to collide with.
       On a phone it is a bottom sheet, and the CTA bar / basemap switch stand
       down while it is open — the panel carries its own call to action. */
    .court-panel {
      position: fixed; z-index: 4; top: 14px; left: 14px;
      width: min(440px, calc(100vw - 28px));
      max-height: calc(100vh - 28px); overflow-y: auto; overscroll-behavior: contain;
      padding: 16px 17px 17px;
    }
    .court-panel[hidden] { display: none; }
    body.court-open .top-panel { display: none; }

    .cp-head { display: flex; align-items: flex-start; gap: 10px; }
    .cp-head h2 { margin: 0; font-size: 19px; font-weight: 900; line-height: 1.25;
      letter-spacing: -.2px; flex: 1 1 auto; min-width: 0; }
    .cp-head .alt { margin: 3px 0 0; font-size: 12.5px; color: var(--ink2); }
    .cp-x { flex: 0 0 auto; appearance: none; border: 1px solid var(--glass-line);
      background: rgba(255,255,255,.07); color: var(--ink); cursor: pointer;
      width: 28px; height: 28px; border-radius: 50%; font-size: 15px; line-height: 1; }
    .cp-city { margin: 3px 0 0; font-size: 12.5px; color: var(--ink2); }

    .cp-sec { margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--glass-line); }
    .cp-sec:first-of-type { border-top: 0; padding-top: 0; }
    .cp-lb { font-size: 10.5px; font-weight: 800; letter-spacing: .7px;
      text-transform: uppercase; color: var(--ink3); margin-bottom: 7px; }

    /* Live. The one thing on this page that is true only right now, so it
       leads and it is the only thing that moves. */
    .cp-live { display: flex; align-items: center; gap: 9px; margin-top: 13px;
      background: rgba(198,255,60,.13); border: 1px solid rgba(198,255,60,.42);
      border-radius: 999px; padding: 9px 14px; }
    .cp-live .pulse { width: 9px; height: 9px; border-radius: 50%; background: #C6FF3C;
      flex: 0 0 auto; animation: cp-pulse 1.9s ease-out infinite; }
    @keyframes cp-pulse {
      0% { box-shadow: 0 0 0 0 rgba(198,255,60,.65); }
      70% { box-shadow: 0 0 0 9px rgba(198,255,60,0); }
      100% { box-shadow: 0 0 0 0 rgba(198,255,60,0); }
    }
    @media (prefers-reduced-motion: reduce) { .cp-live .pulse { animation: none; } }
    .cp-live .n { font-size: 14px; font-weight: 800; color: #DFFF8F; }
    .cp-live .ago { font-size: 12px; color: var(--ink2); }

    .cp-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .cp-chip { font-size: 12px; font-weight: 700; color: var(--ink2);
      background: rgba(255,255,255,.07); border: 1px solid var(--glass-line);
      border-radius: 999px; padding: 5px 10px; }
    .cp-chip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      margin-right: 6px; vertical-align: 0; }

    /* Reported conditions: headcount is the point, so it is the loud part. */
    .cp-cond { display: flex; flex-wrap: wrap; gap: 6px; }
    .cp-cond .c { display: inline-flex; align-items: center; gap: 6px;
      font-size: 12.5px; font-weight: 700; border-radius: 10px; padding: 6px 10px;
      border: 1px solid transparent; }
    .cp-cond .c.green { background: rgba(122,214,109,.16); border-color: rgba(122,214,109,.4); color: #BFF0B4; }
    .cp-cond .c.yellow { background: rgba(255,205,84,.15); border-color: rgba(255,205,84,.4); color: #FFDF9E; }
    .cp-cond .c.red { background: rgba(255,120,110,.15); border-color: rgba(255,120,110,.42); color: #FFB9B3; }
    .cp-cond .c b { font-variant-numeric: tabular-nums; }
    .cp-when { margin: 7px 0 0; font-size: 11.5px; color: var(--ink3); }

    /* Verification. Freshness leads and the count follows — a court fourteen
       people confirmed five years ago is worth less than one confirmed
       yesterday, and side by side that reads backwards. */
    .cp-ver { display: flex; flex-direction: column; gap: 7px; }
    .cp-ver .v { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; }
    .cp-ver .v .ic { flex: 0 0 auto; font-size: 13px; }
    .cp-ver .v .nm { font-weight: 800; color: var(--ink); }
    .cp-ver .v .dt { color: var(--ink2); }
    .cp-ver .v .fr { margin-left: auto; font-size: 11px; font-weight: 800;
      padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
    .cp-ver .v .fr.ok { background: rgba(122,214,109,.16); color: #BFF0B4; }
    .cp-ver .v .fr.old { background: rgba(255,255,255,.07); color: var(--ink3); }
    .cp-ver .sub { margin: 2px 0 0 21px; font-size: 11.5px; color: var(--ink3); }

    .cp-list { margin: 0; padding: 0; list-style: none; font-size: 12.5px; color: var(--ink2); }
    .cp-list li { display: flex; gap: 8px; padding: 3px 0; line-height: 1.5; }
    .cp-list li .k { flex: 0 0 auto; }
    .cp-text { margin: 0; font-size: 12.5px; color: var(--ink2); line-height: 1.6;
      white-space: pre-wrap; }

    .cp-acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .cp-acts a, .cp-acts button { appearance: none; cursor: pointer; text-decoration: none;
      font: inherit; font-size: 13px; font-weight: 800; padding: 9px 14px;
      border-radius: 999px; border: 1px solid var(--glass-line);
      background: rgba(255,255,255,.08); color: var(--ink); }
    .cp-acts a.go { background: var(--accent); color: #fff; border-color: transparent; }
    .cp-cta { display: block; margin-top: 11px; font-size: 12px; font-weight: 700;
      color: var(--ink2); text-decoration: none; }
    .cp-cta:hover { color: var(--ink); }

    @media (max-width: 559px) {
      .court-panel { top: auto; left: 8px; right: 8px; width: auto;
        bottom: calc(8px + env(safe-area-inset-bottom)); max-height: 76vh;
        border-radius: 20px; }
      body.court-open .cta-bar, body.court-open .style-switch { display: none; }
    }

    /* ── 底部 CTA bar ── */
    .cta-bar {
      position: fixed; z-index: 3; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom));
      transform: translateX(-50%); width: min(640px, calc(100vw - 28px));
      padding: 13px 16px; display: flex; align-items: center; gap: 14px;
    }
    .cta-bar .note { flex: 1 1 auto; min-width: 0; font-size: 11.5px; color: var(--ink2); line-height: 1.55; margin: 0; }
    .cta-bar .note b { color: var(--ink); }
    .cta-row { display: flex; gap: 9px; flex: 0 0 auto; }
    .cta-row a { text-decoration: none; padding: 12px 16px; border-radius: 999px; font-weight: 800;
      font-size: 14px; line-height: 1; white-space: nowrap; }
    .cta-row a.primary { background: var(--accent); color: #fff; }
    /* 桌機：加 LINE 由右下 QR 負責，底部按鈕只留「下載 App」，避免與 QR 重複 */
    .cta-bar .cta-row a.primary { display: none; }
    .cta-row a.secondary { background: rgba(255,255,255,.10); color: var(--ink); border: 1.5px solid var(--glass-line);
      display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
    .cta-row a.secondary .btn-icon { width: 18px; height: 18px; border-radius: 50%; display: block; flex: 0 0 auto; }

    /* 桌機 QR 小卡（右下，獨立漂浮） */
    .qr-card { position: fixed; z-index: 3; right: 14px; bottom: calc(92px + env(safe-area-inset-bottom));
      width: 150px; padding: 11px; text-align: center; }
    .qr-head { font-size: 11px; font-weight: 800; color: var(--ink2); margin-bottom: 7px; }
    .qr-box { background: #fff; border-radius: 9px; padding: 7px; display: inline-block; line-height: 0; }
    .qr-box svg, .qr-box img { width: 112px; height: 112px; display: block; }
    .qr-cap { font-size: 10.5px; color: var(--ink2); line-height: 1.45; margin-top: 7px; }

    .loading { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,.75); font-size: 14px; background: rgba(17,21,26,.9); }

    /* Mapbox popup → 深色玻璃 */
    .mapboxgl-popup-content { background: var(--glass); backdrop-filter: blur(10px);
      border: 1px solid var(--glass-line); border-radius: 12px; color: var(--ink);
      padding: 12px 14px; font-size: 13.5px; line-height: 1.55; box-shadow: 0 10px 34px rgba(0,0,0,.4); }
    .mapboxgl-popup-tip { display: none; }
    .mapboxgl-popup-content .nm { font-weight: 800; font-size: 14.5px; }
    .mapboxgl-popup-content .meta { color: var(--ink2); margin-top: 4px; }
    .mapboxgl-popup-content .tag { display: inline-block; margin-top: 7px; padding: 2px 9px;
      border-radius: 999px; font-size: 12px; font-weight: 800; color: #08121f; }
    .mapboxgl-popup-close-button { color: var(--ink2); font-size: 18px; padding: 0 6px; }

    /* ── 手機 ── */
    @media (max-width: 559px) {
      .qr-card { display: none; }
      .mapboxgl-ctrl-top-right .mapboxgl-ctrl-group { display: none; } /* 手機改用雙指縮放 */
      .cta-bar { flex-direction: column; align-items: stretch; gap: 10px; padding: 13px 15px; }
      .cta-row a { flex: 1 1 0; text-align: center; }
      .cta-bar .cta-row a.primary { display: block; }  /* 手機無 QR → 顯示「加入 LINE」按鈕 */
      .top-panel h1 { font-size: 18px; }
      .top-panel { padding: 13px 15px 12px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="scrim top"></div>
  <div class="scrim bottom"></div>

  <!-- 頂部面板 -->
  <div class="top-panel glass">
    <h1 id="pageTitle"></h1>
    <p class="sub" id="pageSub"></p>

    <div class="legend-row" id="legend" hidden></div>
  </div>

  <!-- 球場詳細面板：桌機佔用頂部面板的位置，手機是底部抽屜 -->

  <!-- 底圖切換（與 App 相同的三種） -->

  <!-- 底部 CTA -->

    </div>
  </div>

  <div class="loading" id="loading">🎾</div>

  <script>

    const SUPABASE_URL = "https://dwjwisgbpnrxtcvpbkec.supabase.co";

    // ---- language -------------------------------------------------------
    // Follows the browser, overridable with ?lang=en|zh. The map covers five

    const LANG = (function () {
      const q = new URLSearchParams(location.search).get("lang");
      if (q === "en" || q === "zh") return q;
      return /^zh/i.test(navigator.language || "") ? "zh" : "en";

        parkingCar: "汽車", parkingMotorcycle: "機車",

        hours: "開放時間", pricing: "費用", rentalLb: "租借",
        callCourt: "打電話", website: "官網",
        navigate: "導航", copyLink: "複製連結", copied: "已複製",
        close: "關閉",
        panelCta: "在 App 回報這座球場的狀態",
        justNow: "剛剛", minsAgo: n => `${n} 分鐘前`, hoursAgo: n => `${n} 小時前`,
        daysAgo: n => `${n} 天前`, monthsAgo: n => `${n} 個月前`, yearsAgo: n => `${n} 年前`,
        rentals: { yes: "可租借", no: "不開放租借" },
        surfaces: { hard: "硬地", clay: "紅土", grass: "草地",
                    artificial_grass: "人工草", omni: "砂地人工草", concrete: "水泥",
                    pu: "PU", carpet: "地毯", other: "其他", unknown: "未標示" },
      },
      en: {
        title: "Tennis Nut Court Map",
        sub: "Surface, floodlights, parking, and details players have confirmed on the ground.",
        courts: "courts", markets: "markets", surfaced: "with a surface",
        unknown: "not recorded", note: "⚠️ Court details can be incomplete — report info and conditions via LINE or the app.",
        ctaPrimary: "Report a court on LINE", ctaSecondary: "Request the Tennis Nut app",
        qrHead: "Scan to add our LINE account",
        courtsUnit: n => `${n} court${n === 1 ? "" : "s"}`, lights: "Floodlights", indoor: "Indoor",
        styleStreets: "Streets", styleDark: "Dark", styleSatellite: "Satellite",
        accessFree: "Free", accessPaid: "Paid", accessPrivate: "Private",
        parking: n => `Parking ${n} min walk`,
        confirmed: n => `${n} player${n === 1 ? "" : "s"} confirmed`,
        playingNow: n => `${n} playing now`,
        justArrived: "Someone just arrived",
        arrivedMins: n => `Someone arrived ${n} min ago`,
        arrivedHours: n => `Someone arrived ${n} h ago`,
        liveStat: n => `${n} court${n === 1 ? "" : "s"} live now`,
        courtStatus: "Status", lastUpdated: "Last updated",
        cond: { playable: "Playable", occupied: "Full", wet: "Wet",
                damaged: "Damaged", closed: "Closed" },
        verifyCommunity: "Community verified", verifyRemote: "Remotely verified",
        verifyOfficial: "Officially verified",
        verifyCommunityCount: n => `${n} player${n === 1 ? "" : "s"} confirmed`,
        verifyFresh: "still current", verifyStale: "due a re-check",
        parkingNearby: "Parking nearby", parkingWalk: n => `${n} min walk`,
        parkingUnnamed: "Car park", parkingMore: n => `${n} more nearby`,
        parkingCar: "cars", parkingMotorcycle: "motorcycles",
        parkingMixed: "cars & motorcycles", parkingPaid: "paid", parkingFree: "free",
        hours: "Opening hours", pricing: "Pricing", rentalLb: "Rental",
        callCourt: "Call", website: "Website",
        navigate: "Directions", copyLink: "Copy link", copied: "Copied",
        close: "Close",
        panelCta: "Report this court's condition in the app",
        justNow: "just now", minsAgo: n => `${n} min ago`, hoursAgo: n => `${n} h ago`,
        daysAgo: n => `${n} d ago`, monthsAgo: n => `${n} mo ago`, yearsAgo: n => `${n} y ago`,
        rentals: { yes: "Rackets/balls for hire", no: "No rental" },
        surfaces: { hard: "Hard", clay: "Clay", grass: "Grass",
                    artificial_grass: "Artificial grass", omni: "Sand-filled turf",
                    concrete: "Concrete", pu: "PU", carpet: "Carpet",
                    other: "Other", unknown: "Not recorded" },
      },
    }[LANG];

    // Every surface the database can hold, plus the one it cannot: null.
    // The old legend folded 1,848 courts with NO surface data into "其他",
    // which reads as a known answer. Not knowing is its own category, and on
    // a page whose selling point is data quality it has to say so.
    const SURFACE_ORDER = ["hard", "clay", "grass", "artificial_grass", "omni",
                           "concrete", "pu", "carpet", "other", "unknown"];
    const COLORS = {
      hard: "#4FA8FF", clay: "#FF6A3D", grass: "#7ED957",
      artificial_grass: "#69C79A", omni: "#C9A66B", concrete: "#9AA3AA",
      pu: "#B98CD9", carpet: "#E38FB5", other: "#AEB6BD", unknown: "#5B6169",
    };

    function surfaceClass(code) {
      const c = (code || "").trim();
      return SURFACE_ORDER.includes(c) && c ? c : "unknown";
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, m =>
        ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
    }

    mapboxgl.accessToken = MAPBOX_TOKEN;
    // 預設帶傾斜＋旋轉視角，更有空間縱深；手機較保守確保台灣框得好
    // The tilt stays; the centre no longer does. Taiwan was a safe default
    // when it was the only data — now a visitor in Madrid or Tokyo would open
    // the page on the other side of the world and see nothing they can reach.
    // Geolocation is asked for after the map is up, so a refusal or a slow
    // fix costs nothing: the map is already usable and simply stays here.
    const isMobile = window.matchMedia("(max-width: 559px)").matches;
    const VIEW = isMobile
      ? { center: [120.95, 23.55], zoom: 6.05, pitch: 30, bearing: -14 }
      : { center: [121.05, 23.45], zoom: 7.0, pitch: 52, bearing: -26 };
    // The same three basemaps the app offers, so the two feel like one product.
    const STYLES = [
      { key: "streets",   label: () => T.styleStreets,   uri: "mapbox://styles/mapbox/streets-v12" },
      { key: "dark",      label: () => T.styleDark,      uri: "mapbox://styles/mapbox/dark-v11" },
      { key: "satellite", label: () => T.styleSatellite, uri: "mapbox://styles/mapbox/satellite-streets-v12" },
    ];
    // Dark by default, matching the app. A copied link carries whichever the
    // sender was looking at: satellite is usually WHY someone shares a court —
    // you can count the courts and see the surface — and arriving on the dark
    // basemap loses the thing they meant to show.
    const styleParam = new URLSearchParams(location.search).get("style");
    let styleKey = STYLES.some(x => x.key === styleParam) ? styleParam : "dark";

    const map = new mapboxgl.Map({
      container: "map",
      style: STYLES.find(x => x.key === styleKey).uri,
      center: VIEW.center,
      zoom: VIEW.zoom,
      pitch: VIEW.pitch,
      bearing: VIEW.bearing,
      logoPosition: "bottom-left",
      attributionControl: false,
    });
    map.addControl(new mapboxgl.AttributionControl({ compact: true }), "bottom-left");
    map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), "top-right");

    (function buildSwitch() {
      const el = document.getElementById("styleSwitch");
      el.innerHTML = STYLES.map(st =>
        `<button data-k="${st.key}" aria-pressed="${st.key === styleKey}">${st.label()}</button>`).join("");
      el.hidden = false;
      el.addEventListener("click", (ev) => {
        const b = ev.target.closest("button");
        if (!b || b.dataset.k === styleKey) return;
        styleKey = b.dataset.k;
        [...el.children].forEach(x => x.setAttribute("aria-pressed", String(x.dataset.k === styleKey)));
        // Changing style wipes every source and layer, so the court layer has
        // to be added again once the new style is ready.
        styleReady = false;
        map.setStyle(STYLES.find(x => x.key === styleKey).uri);
        // No listener here: the permanent style.load handler puts the courts
        // back. One place that re-adds them, whatever caused the change.
      });
    })();

    // Centre on the viewer once we have a fix. flyTo rather than jumpTo so it
    // reads as the map finding them, and the pitch/bearing are carried over
    // deliberately — the angle is the look of the page.
    // ...unless the link already names a court. Someone opening an invitation
    // is being sent somewhere specific; flying them home instead would undo
    // the whole point of the link.
    if (navigator.geolocation && !new URLSearchParams(location.search).get("court")) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          map.flyTo({
            center: [pos.coords.longitude, pos.coords.latitude],
            zoom: 12,
            pitch: VIEW.pitch,
            bearing: VIEW.bearing,
            duration: 1400,
          });
        },
        () => { /* denied or unavailable — the default view is fine */ },
        { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 },
      );
    }

    // 圖層需在樣式就緒後才能加。資料與樣式各自非同步，兩者都備妥才加圖層，
    // 並用 getSource 防重複（避免 once('load') 競態導致圖層永遠沒加上）。
    // ── 球場詳細面板 ────────────────────────────────────────────────────
    const panelEl = document.getElementById("courtPanel");
    let openCourtId = null;

    function closePanel() {
      openCourtId = null;
      panelEl.hidden = true;
      document.body.classList.remove("court-open");
    }
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePanel(); });

    // Shift the map so the court is not underneath the panel: sideways on a
    // wide screen where the panel is a column, upwards on a phone where it is
    // a sheet.
    function panelOffset() {
      return window.matchMedia("(max-width: 559px)").matches
        ? [0, -Math.round(window.innerHeight * 0.18)]
        : [Math.round(Math.min(230, window.innerWidth * 0.22)), 0];
    }

    // Coarse and human. An exact "3 days 4 hours" is precision nobody asked
    // for about a fact that is only ever used as "recent or not".
    function ago(iso) {
      if (!iso) return "";
      const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
      if (mins < 2) return T.justNow;
      if (mins < 60) return T.minsAgo(mins);
      const h = Math.floor(mins / 60);
      if (h < 24) return T.hoursAgo(h);
      const d = Math.floor(h / 24);
      if (d < 31) return T.daysAgo(d);
      const mo = Math.floor(d / 30);
      if (mo < 12) return T.monthsAgo(mo);
      return T.yearsAgo(Math.floor(mo / 12));
    }

    // Which conditions to show and in what order. Headcount first, severity as
    // the tie-break — the same rule as CourtCondition.sortedEntries in the app
    // and countEntries in the LIFF page, so the three never disagree about
    // which condition a court is in.
    const COND_LIGHT = { playable: "green", occupied: "yellow", wet: "yellow",
                         damaged: "red", closed: "red" };
    const COND_EMOJI = { playable: "✅", occupied: "🚫", wet: "💧",
                         damaged: "⚠️", closed: "🔒" };
    const COND_SEVERITY = { closed: 3, damaged: 3, wet: 2, occupied: 2, playable: 1 };
    function condEntries(counts) {
      if (!counts) return [];
      return Object.entries(counts).filter(([, v]) => v > 0)
        .sort((a, b) => (b[1] - a[1]) ||
              ((COND_SEVERITY[b[0]] || 0) - (COND_SEVERITY[a[0]] || 0)));
    }
    // A reported condition decays after six hours — same window as the marker
    // colour and the LIFF view. A 客滿 from this morning is not information
    // about this afternoon.
    const STATUS_FRESH_MS = 6 * 3600 * 1000;
    const statusFresh = (iso) => !!iso && (Date.now() - new Date(iso).getTime()) <= STATUS_FRESH_MS;

    function renderPanel(f, d, parking, live) {
      openCourtId = f.id;
      d = d || {};
      const sec = [];

      // Live first: it is the only thing here that is true only right now.
      if (live && live.playing_now > 0) {
        const mins = live.latest_arrival
          ? Math.floor((Date.now() - new Date(live.latest_arrival).getTime()) / 60000) : null;
        const arr = mins == null ? ""
          : mins < 5 ? T.justArrived
          : mins < 60 ? T.arrivedMins(mins)
          : T.arrivedHours(Math.floor(mins / 60));
        sec.push(`<div class="cp-live"><span class="pulse"></span>` +
          `<span class="n">${escapeHtml(T.playingNow(live.playing_now))}</span>` +
          (arr ? `<span class="ago">· ${escapeHtml(arr)}</span>` : "") + `</div>`);
      }

      // Reported condition. Silence beats 「未知」: a court nobody has reported
      // on says nothing rather than carrying a grey row saying so.
      const entries = statusFresh(d.last_reported_at) ? condEntries(d.status_counts) : [];
      const freeText = statusFresh(d.last_reported_at) && d.status_text;
      if (entries.length || freeText) {
        let body = entries.length
          ? `<div class="cp-cond">` + entries.map(([k, v]) =>
              `<span class="c ${COND_LIGHT[k] || "green"}">${COND_EMOJI[k] || "📋"} ` +
              `${escapeHtml(T.cond[k] || k)} <b>${v}</b></span>`).join("") + `</div>`
          : `<p class="cp-text">${escapeHtml(d.status_text)}</p>`;
        if (d.last_reported_at)
          body += `<p class="cp-when">${escapeHtml(T.lastUpdated)} · ${escapeHtml(ago(d.last_reported_at))}</p>`;
        sec.push(`<div class="cp-sec"><div class="cp-lb">${escapeHtml(T.courtStatus)}</div>${body}</div>`);
      }

      // The facts that do not change: surface, size, lights, access.
      const chips = [`<span class="cp-chip"><span class="sw" style="background:${COLORS[f.cls]}"></span>${escapeHtml(T.surfaces[f.cls])}</span>`];
      if (f.court_count) chips.push(`<span class="cp-chip">${escapeHtml(T.courtsUnit(f.court_count))}</span>`);
      if (f.light) chips.push(`<span class="cp-chip">${escapeHtml(T.lights)}</span>`);
      if (f.indoor) chips.push(`<span class="cp-chip">${escapeHtml(T.indoor)}</span>`);
      if (f.access === "free") chips.push(`<span class="cp-chip">${escapeHtml(T.accessFree)}</span>`);
      else if (f.access === "paid") chips.push(`<span class="cp-chip">${escapeHtml(T.accessPaid)}</span>`);
      else if (f.access === "private") chips.push(`<span class="cp-chip">${escapeHtml(T.accessPrivate)}</span>`);
      sec.push(`<div class="cp-sec"><div class="cp-chips">${chips.join("")}</div></div>`);

      // Verification. Rendered only where it exists — most of the imported set
      // has none, and a stack of grey "not verified" rows on 3,000 courts
      // reads as a defect rather than as the absence of information it is.
      const vers = [
        ["👤", T.verifyCommunity, d.community_verified_at, d.community_fresh,
         d.community_verify_count > 0 ? T.verifyCommunityCount(d.community_verify_count) : null],
        ["🛰", T.verifyRemote, d.remote_verified_at, d.remote_fresh, null],
        ["✔", T.verifyOfficial, d.official_verified_at, d.official_fresh, null],
      ].filter(v => v[2]);
      if (vers.length) {
        sec.push(`<div class="cp-sec"><div class="cp-ver">` + vers.map(([ic, nm, at, fresh, sub]) =>
          `<div><div class="v"><span class="ic">${ic}</span>` +
          `<span class="nm">${escapeHtml(nm)}</span>` +
          `<span class="dt">${escapeHtml(ago(at))}</span>` +
          `<span class="fr ${fresh ? "ok" : "old"}">${escapeHtml(fresh ? T.verifyFresh : T.verifyStale)}</span></div>` +
          (sub ? `<div class="sub">${escapeHtml(sub)}</div>` : "") + `</div>`).join("") +
          `</div></div>`);
      }

      // Parking, up to three. One was not enough: the nearest space to a court
      // in Taiwan is routinely a motorcycle bay, which is the wrong answer for
      // someone arriving by car.
      if (parking && parking.length) {
        const vlabel = { car: T.parkingCar, motorcycle: T.parkingMotorcycle, mixed: T.parkingMixed };
        // Named car parks are three different answers; unnamed ones are the
        // same answer three times. The extras become a count on the nearest,
        // which is the only part of them that is information.
        const named = parking.filter(pk => pk.name);
        const anon = parking.filter(pk => !pk.name);
        const shown = named.concat(anon.slice(0, 1));
        const extra = anon.length - 1;
        sec.push(`<div class="cp-sec"><div class="cp-lb">${escapeHtml(T.parkingNearby)}</div><ul class="cp-list">` +
          shown.map(pk => {
            const bits = [T.parkingWalk(Math.max(1, Math.ceil(pk.distance_m / 80)))];
            if (vlabel[pk.vehicle]) bits.push(vlabel[pk.vehicle]);
            if (pk.fee === "yes") bits.push(T.parkingPaid);
            else if (pk.fee === "no") bits.push(T.parkingFree);
            if (!pk.name && extra > 0) bits.push(T.parkingMore(extra));
            return `<li><span class="k">🅿️</span><span>${escapeHtml(pk.name || T.parkingUnnamed)}` +
                   ` · ${escapeHtml(bits.join(" · "))}</span></li>`;
          }).join("") + `</ul></div>`);
      }

      // Hours, price, rental — the open-data fields that are prose, not chips.
      const rows = [];
      if (d.hours_text) rows.push([T.hours, d.hours_text]);
      if (d.pricing_note) rows.push([T.pricing, d.pricing_note]);
      if (d.rental && T.rentals[d.rental]) rows.push([T.rentalLb, T.rentals[d.rental]]);
      if (rows.length || d.opening_notes) {
        sec.push(`<div class="cp-sec"><ul class="cp-list">` +
          rows.map(([k, v]) => `<li><span class="k">${escapeHtml(k)}</span><span>${escapeHtml(v)}</span></li>`).join("") +
          `</ul>` + (d.opening_notes ? `<p class="cp-text" style="margin-top:6px">${escapeHtml(d.opening_notes)}</p>` : "") +
          `</div>`);
      }

      const [lng, lat] = [f._lng, f._lat];
      const acts = [`<a class="go" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}">${escapeHtml(T.navigate)}</a>`];
      if (d.tel) acts.push(`<a href="tel:${encodeURIComponent(d.tel)}">${escapeHtml(T.callCourt)}</a>`);
      if (d.website) acts.push(`<a target="_blank" rel="noopener" href="${escapeHtml(d.website)}">${escapeHtml(T.website)}</a>`);
      acts.push(`<button type="button" id="cpCopy">${escapeHtml(T.copyLink)}</button>`);

      const altName = (LANG === "en" ? null : d.name_en) || null;
      panelEl.innerHTML =
        `<div class="cp-head"><div style="flex:1 1 auto;min-width:0">` +
        `<h2>${escapeHtml(f.name)}</h2>` +
        (altName && altName !== f.name ? `<p class="alt">${escapeHtml(altName)}</p>` : "") +
        (f.city ? `<p class="cp-city">${escapeHtml(f.city)}${d.address ? " · " + escapeHtml(d.address) : ""}</p>` : "") +
        `</div><button class="cp-x" type="button" id="cpClose" aria-label="${escapeHtml(T.close)}">✕</button></div>` +
        sec.join("") +
        `<div class="cp-acts">${acts.join("")}</div>` +
        `<a class="cp-cta" href="https://forms.gle/N7EKJ58FmvhVKQs69" target="_blank" rel="noopener">${escapeHtml(T.panelCta)} →</a>`;

      panelEl.hidden = false;
      panelEl.scrollTop = 0;
      document.body.classList.add("court-open");
      document.getElementById("cpClose").onclick = closePanel;
      document.getElementById("cpCopy").onclick = (ev) => {
        const url = `${location.origin}/courts-map?court=${f.id}&lang=${LANG}&style=${styleKey}`;
        navigator.clipboard && navigator.clipboard.writeText(url);
        ev.currentTarget.textContent = T.copied;
      };
    }

    // court_id → { playing_now, latest_arrival }. Empty until courts_live_now
    // lands, and usually empty after: on most days nobody is on court.
    let liveByCourt = {};
    function liveFeatures() {
      if (!courtFeatures) return [];
      return courtFeatures.filter(f => liveByCourt[f.properties.id]);
    }
    function refreshLiveLayer() {
      if (map.getSource("live")) {
        map.getSource("live").setData({ type: "FeatureCollection", features: liveFeatures() });
      }
    }

    // One rAF loop, started only when there is something to pulse and stopped
    // when there is not — an always-running animation would repaint the whole
    // map forever for a ring that is usually not on screen.
    let pulseRunning = false, pulseLast = 0;
    function pulse(ts) {
      if (!pulseRunning) return;
      if (ts - pulseLast > 50) {              // ~20fps is plenty for a breath
        pulseLast = ts;
        const t = (ts % 2400) / 2400;
        if (map.getLayer("courts-live")) {
          map.setPaintProperty("courts-live", "circle-radius", 14 + 12 * t);
          map.setPaintProperty("courts-live", "circle-stroke-opacity", 0.85 * (1 - t));
        }
      }
      requestAnimationFrame(pulse);
    }
    function setPulse(on) {
      if (on === pulseRunning) return;
      pulseRunning = on;
      if (on) requestAnimationFrame(pulse);
    }

    let courtFeatures = null;

    // setStyle throws away every source and layer, so the courts have to go
    // back on afterwards, and the data may arrive before or after the style is
    // ready — hence a flag plus a call from both sides.
    //
    // The guard used to be isStyleLoaded(). That was the bug: on a basemap
    // change GL JS fires style.load and three styledata events, and
    // isStyleLoaded() is false at every one of them — the sprite and tiles are
    // still coming. It never fires again once it turns true, so tryAddLayers
    // bailed each time and nothing called it back. style.load is the correct
    // signal: it means the style is installed and addSource/addLayer are
    // legal, which is all this needs. Whether the tiles have arrived is not
    // this function's business.
    let styleReady = false;
    function tryAddLayers() {
      if (!courtFeatures || !styleReady || map.getSource("courts")) return;
      addCourtLayers(courtFeatures);
    }
    map.on("style.load", () => { styleReady = true; tryAddLayers(); });

    let wiredUp = false;
    function addCourtLayers(features) {
      map.addSource("courts", { type: "geojson",
        data: { type: "FeatureCollection", features } });

      const colorExpr = ["match", ["get", "cls"],
        "clay", COLORS.clay, "hard", COLORS.hard, "grass", COLORS.grass, COLORS.other];
      // 半徑放大，固定傾斜相機(zoom 較遠)下點才看得清楚
      const radiusExpr = ["interpolate", ["linear"], ["zoom"],
        5, 5, 7, 7.5, 10, 10, 14, 13];
      // 光暈層半徑 ≈ 實心點 ×2.2（不能把 zoom 內插巢狀包在 "*" 裡，需獨立寫死）
      const glowRadiusExpr = ["interpolate", ["linear"], ["zoom"],
        5, 11, 7, 16.5, 10, 22, 14, 29];

      // Courts with someone on them right now. A ring under the dot, breathing
      // slowly, on the handful of courts where it is true — the one thing on
      // this map that no other court map can show, so it earns the motion.
      map.addSource("live", { type: "geojson",
        data: { type: "FeatureCollection", features: liveFeatures() } });
      map.addLayer({
        id: "courts-live", type: "circle", source: "live",
        paint: {
          "circle-color": "rgba(0,0,0,0)",
          "circle-radius": 16,
          "circle-stroke-color": "#C6FF3C",
          "circle-stroke-width": 2,
          "circle-stroke-opacity": 0.9,
        },
      });

      // 光暈層（底）
      map.addLayer({
        id: "courts-glow", type: "circle", source: "courts",
        paint: {
          "circle-color": colorExpr,
          "circle-radius": glowRadiusExpr,
          "circle-blur": 1,
          "circle-opacity": 0.45,
        },
      });
      // 實心點（上）
      map.addLayer({
        id: "courts", type: "circle", source: "courts",
        paint: {
          "circle-color": colorExpr,
          "circle-radius": radiusExpr,
          "circle-stroke-width": 1,
          "circle-stroke-color": "#fff",
          "circle-stroke-opacity": 0.85,
          "circle-opacity": 0.95,
        },
      });

      // The name, once close enough that there is room for it. Below this the
      // dots are a density picture and labels would be a wall of text; above
      // it you are looking at somewhere specific and the dot alone means you
      // have to tap each one to find out what it is.
      // text-optional + no overlap: where names collide the map drops the
      // label and keeps the dot, rather than hiding courts to fit words.
      map.addLayer({
        id: "courts-label", type: "symbol", source: "courts", minzoom: 12,
        layout: {
          "text-field": ["get", "name"],
          "text-font": ["Open Sans Regular", "Arial Unicode MS Regular"],
          "text-size": ["interpolate", ["linear"], ["zoom"], 12, 11, 16, 13.5],
          "text-anchor": "top",
          "text-offset": [0, 0.9],
          "text-optional": true,
          "text-allow-overlap": false,
          "text-padding": 4,
          "text-max-width": 9,
        },
        paint: {
          "text-color": "#FFFFFF",
          "text-halo-color": "rgba(6,9,13,.9)",
          "text-halo-width": 1.4,
        },
      });

      // The popup this replaced held a name, four chips and a parking line.
      // The app's court sheet holds the reported condition and its headcount,
      // who is on the court right now, three tiers of verification with their
      // freshness, hours, pricing, rental, phone and site. On a page whose
      // whole claim is data quality, showing a tenth of what is known was the
      // weakest thing about it.
      async function openCourt(f, lngLat) {
        // Directions should aim at the court, not at the pixel that was
        // tapped, so the coordinates come off the feature.
        f = Object.assign({}, f, { _lng: lngLat[0], _lat: lngLat[1] });
        renderPanel(f, null, null, null);
        map.easeTo({ center: lngLat, offset: panelOffset(), duration: 500 });

        // Three requests, all optional. The panel is already on screen with
        // what the map itself knows, so each one only ever adds.
        const headers = { apikey: ANON, Authorization: "Bearer " + ANON,
                          "Content-Type": "application/json" };
        const q = (path, init) => fetch(SUPABASE_URL + path, init || { headers })
          .then(r => r.ok ? r.json() : null).catch(() => null);

        const [detail, parking, live] = await Promise.all([
          q(`/rest/v1/courts_with_status?id=eq.${f.id}&select=name_en,city_en,` +
            `status_light,status_text,status_counts,last_reported_at,` +
            `community_verified_at,community_verify_count,community_fresh,` +
            `remote_verified_at,remote_fresh,official_verified_at,official_fresh,` +
            `hours_text,opening_notes,pricing_note,rental,tel,website,address`),
          q(`/rest/v1/court_parking?court_id=eq.${f.id}&select=name,distance_m,fee,vehicle&order=rank&limit=3`),
          q(`/rest/v1/rpc/court_live_activity`,
            { method: "POST", headers, body: JSON.stringify({ p_court_id: f.id }) }),
        ]);
        // Someone may have clicked another court while these were in flight.
        if (openCourtId !== f.id) return;
        renderPanel(f, detail && detail[0], parking || [], live && live[0]);
      }

      // Everything below binds to the map, not to the style, so it survives a
      // restyle and must only happen once.
      if (wiredUp) return;
      wiredUp = true;

      map.on("click", "courts", (ev) => {
        openCourt(ev.features[0].properties, ev.features[0].geometry.coordinates);
      });

      // /courts-map?court=451 — what an invitation links to, so the recipient
      // lands on the court itself rather than on the whole of Taiwan.
      const wanted = new URLSearchParams(location.search).get("court");
      if (wanted) {
        const f = courtFeatures.find(x => String(x.properties.id) === wanted);
        if (f) {
          const [lng, lat] = f.geometry.coordinates;
          map.flyTo({ center: [lng, lat], zoom: 15, duration: 0 });
          openCourt(f.properties, [lng, lat]);
        }
      }
      map.on("mouseenter", "courts", () => { map.getCanvas().style.cursor = "pointer"; });
      map.on("mouseleave", "courts", () => { map.getCanvas().style.cursor = ""; });

      // 不用 fitBounds（會重置 pitch/bearing）；資料恆為台灣，採固定傾斜相機（見建構時 VIEW）
    }

    document.getElementById("pageTitle").textContent = T.title;
    document.getElementById("pageSub").textContent = T.sub;
    document.getElementById("ctaNote").textContent = T.note;
    document.getElementById("ctaPrimary").textContent = T.ctaPrimary;
    document.getElementById("ctaSecondary").textContent = T.ctaSecondary;
    document.getElementById("qrHead").textContent = T.qrHead;

    async function load() {
      const counts = {};
      try {
        const url = SUPABASE_URL + "/rest/v1/courts"
          + "?select=id,name,name_en,city,country,lat,lng,surface_code,court_count"
          + ",light,is_indoor,access,community_verify_count"
          + "&lat=not.is.null&lng=not.is.null&is_abandoned=eq.false&limit=5000";
        const r = await fetch(url, { headers: { apikey: ANON, Authorization: "Bearer " + ANON } });
        const courts = await r.json();

        const features = [];
        const markets = new Set();
        for (const c of courts) {
          if (typeof c.lat !== "number" || typeof c.lng !== "number") continue;
          const cls = surfaceClass(c.surface_code);
          counts[cls] = (counts[cls] || 0) + 1;
          if (c.country) markets.add(c.country);
          features.push({
            type: "Feature",
            geometry: { type: "Point", coordinates: [c.lng, c.lat] },
            properties: {
              cls,
              id: c.id,
              // An English reader gets name_en where a mapper supplied one;
              // otherwise the endonym, which is what the place is called.
              name: (LANG === "en" && c.name_en) ? c.name_en : (c.name || ""),
              city: c.city || "",
              court_count: c.court_count || 0,
              light: c.light === true,
              indoor: c.is_indoor === true,
              access: c.access || "",
              confirmed: c.community_verify_count || 0,
            },
          });
        }

        // Legend: one entry per surface that actually occurs, so a market
        // with no clay does not carry a permanent zero.
        const legend = document.getElementById("legend");
        legend.innerHTML = SURFACE_ORDER
          .filter(k => counts[k])
          .map(k => `<span class="it"><span class="dot" style="background:${COLORS[k]};color:${COLORS[k]}"></span>${T.surfaces[k]} <span class="cnt">${counts[k]}</span></span>`)
          .join("");
        legend.hidden = false;

        const total = Object.values(counts).reduce((a, b) => a + b, 0);
        const known = total - (counts.unknown || 0);
        const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
        // The old strip compared northern and southern Taiwan, which stopped
        // meaning anything once four other markets were on the map. Coverage
        // is the honest headline now — including how much of it has no
        // surface recorded, which is the gap this page is asking help with.
        document.getElementById("stats").innerHTML =
            `<span class="stat"><b>${total}</b> ${T.courts}</span>`
          + `<span class="stat"><b>${markets.size}</b> ${T.markets}</span>`
          + `<span class="stat">${T.surfaced} <b>${pct(known, total)}%</b></span>`
          // Filled in by loadLive, and hidden on the ordinary day when nobody
          // is on a court — a permanent "0 live" would make the map look dead
          // rather than quiet.
          + `<span class="stat" id="liveStat" hidden></span>`;

        // 資料備妥 → 嘗試加圖層（樣式若還沒好，map 'load' 事件會再觸發一次）
        courtFeatures = features;
        tryAddLayers();
        loadLive();
      } catch (e) {
        document.getElementById("stats").innerHTML =
          `<span class="stat">${LANG === "zh" ? "資料載入失敗，請稍後再試" : "Couldn't load the data — please try again"} 🙏</span>`;
      } finally {
        const l = document.getElementById("loading");
        if (l) l.remove();
      }
    }
    load();

    // Who is on court right now. A separate request from the courts because it
    // is the only thing here with a shelf life — and it is re-asked on a timer
    // so a page left open on a desk does not quietly go stale.
    async function loadLive() {
      try {
        const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/courts_live_now",
          { method: "POST",
            headers: { apikey: ANON, Authorization: "Bearer " + ANON,
                       "Content-Type": "application/json" },
            body: "{}" });
        if (!r.ok) return;
        const rows = await r.json();
        liveByCourt = {};
        for (const row of rows || []) liveByCourt[row.court_id] = row;
        refreshLiveLayer();
        setPulse(rows && rows.length > 0);

        const el = document.getElementById("liveStat");
        if (el) {
          if (rows && rows.length) { el.textContent = T.liveStat(rows.length); el.hidden = false; }
          else el.hidden = true;
        }
      } catch (_) { /* the map is complete without it */ }
    }
    setInterval(loadLive, 120000);

    (function () {
      try {
        const qr = qrcode(0, "M");
        qr.addData("https://line.me/R/ti/p/@tennisnut");
        qr.make();
        document.getElementById("qr").innerHTML =
          qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
        document.getElementById("qrCard").hidden = false;
      } catch (e) { /* QR 函式庫載入失敗 → 維持隱藏 */ }
    })();
  </script>
</body>
</html>
