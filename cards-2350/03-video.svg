<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1080" height="1080" fill="#FBFAF6"/>
  <rect width="1080" height="14" fill="#1B5138"/>
  <text x="80" y="170" font-size="72" font-weight="800" fill="#1B5138">累積堅果，來一次影片諮詢</text>
  <text x="80" y="228" font-size="34" fill="#6E776F">錄一段自己的動作，讓專家看著回答</text>
  <rect x="80" y="286" width="920" height="300" rx="34" fill="#FFFFFF" stroke="#ECEAE2" stroke-width="2"/>
  <text x="128" y="360" font-size="44">🎬</text>
  <text x="196" y="360" font-size="38" fill="#2E5A34" font-weight="800">影片分析</text>
  <rect x="128" y="404" width="240" height="66" rx="20" fill="#F3F8EC"/>
  <text x="248" y="448" font-size="32" fill="#3C6E3F" font-weight="800" text-anchor="middle">250 🌰</text>
  <text x="400" y="448" font-size="31" fill="#5E7A60">專家看完你的影片，回一份完整的分析</text>
  <text x="128" y="526" font-size="31" fill="#5E7A60">附影片不用另外花堅果——每月 2 支、每支 30 秒，</text>
  <text x="128" y="574" font-size="31" fill="#5E7A60">太大或太長會先告訴你。</text>
  <rect x="80" y="626" width="920" height="208" rx="30" fill="#F3F8EC"/>
  <text x="128" y="692" font-size="34" fill="#3C6E3F" font-weight="700">堅果只從打球來：記一次練習 5、首次拜訪一座</text>
  <text x="128" y="746" font-size="34" fill="#3C6E3F" font-weight="700">球場 15、回報球場狀態 15、補一座新球場 50。</text>
  <text x="128" y="800" font-size="34" fill="#3C6E3F" font-weight="700">打著打著就存起來了 🌰</text>
  <text x="80" y="892" font-size="28" fill="#9BA29B">想傳長一點的影片？貼 YouTube（不公開）或雲端硬碟連結也可以</text>
  <text x="540" y="1012" font-size="32" text-anchor="middle" fill="#9BA29B">Your tennis life, <tspan fill="#1B5138" font-weight="800">connected.</tspan></text>
</svg>
