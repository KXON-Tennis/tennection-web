<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 364" role="img" aria-label="與開發者的對話" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect x="4" y="4" width="352" height="356" rx="34" fill="#DEDACE"/>
  <rect x="8" y="8" width="344" height="348" rx="30" fill="#FBFAF6"/>
  <rect x="154" y="20" width="52" height="5" rx="2.5" fill="#C9C5B8"/>

  <text x="34" y="62" font-size="16" fill="#1B5138" font-weight="800">與開發者的對話</text>
  <text x="34" y="82" font-size="11.5" fill="#9BA29B">這裡只有你與開發者本人</text>
  <line x1="34" y1="96" x2="326" y2="96" stroke="#ECEAE2"/>

  <!-- 使用者那一則（靠右） -->
  <rect x="120" y="112" width="206" height="54" rx="14" fill="#3F7C43"/>
  <text x="138" y="134" font-size="12" fill="#FFFFFF">地圖可以只看有燈的球場嗎？</text>
  <text x="138" y="152" font-size="12" fill="#FFFFFF">晚上才有空打</text>
  <text x="318" y="180" font-size="10" fill="#9BA29B" text-anchor="end">21:04</text>

  <!-- 開發者回覆（靠左） -->
  <circle cx="50" cy="212" r="15" fill="#1B5138"/>
  <text x="50" y="217" font-size="12" fill="#FFFFFF" text-anchor="middle">🌰</text>
  <rect x="72" y="194" width="212" height="72" rx="14" fill="#FFFFFF" stroke="#ECEAE2"/>
  <text x="88" y="216" font-size="12" fill="#3B443C">可以，篩選裡有「夜間照明」。</text>
  <text x="88" y="234" font-size="12" fill="#3B443C">如果有球場的燈光資料是空的，</text>
  <text x="88" y="252" font-size="12" fill="#3B443C">回報一下我補進去 🙏</text>
  <text x="72" y="282" font-size="10" fill="#9BA29B">21:11</text>

  <!-- 輸入列 -->
  <rect x="34" y="300" width="238" height="38" rx="19" fill="#FFFFFF" stroke="#ECEAE2"/>
  <text x="54" y="324" font-size="12" fill="#9BA29B">說點什麼⋯</text>
  <circle cx="302" cy="319" r="19" fill="#3F7C43"/>
  <path d="M294 319 L310 319 M304 313 L310 319 L304 325" stroke="#FFFFFF" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
