<html lang="zh-Hant">
<head>

  <meta name="description" content="球友自發的網球場地圖：每一個點都是有人真的到場、以 GPS 確認過的地方，球場資料也是球友在現場補上的。" />

  <meta property="og:description" content="每一個點都是有人真的到場、以 GPS 確認過的地方，球場資料也是球友在現場補上的。" />

  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>

  <!--
    公開足跡頁（2026-11-12，為 11/18 GIS Day 成果發表做的）。

    資料只來自三支公開的彙總查詢（tns-diary-app migration 20261112111720）：
      public_footprint_map / public_footprint_totals / public_contribution_stats
    它們已經把公開尺度定在資料庫那一層：3 人以上才有人數與大頭照、沒有名字、
    沒有日期。這一頁不要另外去讀別的表來補資訊——補上去的就是公開出去的。

    外觀沿用 App 的全體足跡地圖（footprint_map_screen.dart）：衛星底、青藍點
    #2EC4E6 加白框黑描邊、半徑跟人數開根號成正比。
  -->
  <style>
    :root {
      --cyan: #3FD4F2;
      --wall: #D9A97A;
      --indoor: #F5C451;
      --glass: rgba(14,19,25,.78);
      --glass-line: rgba(255,255,255,.12);
      --ink: #F2F5F7; --ink2: #B4C0CA; --ink3: #7C8B99;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
        "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
      background: #0d1116; color: var(--ink); overflow: hidden;
    }
    #map { position: fixed; inset: 0; background: #0d1116; }
    .mapboxgl-ctrl-logo, .mapboxgl-ctrl-attrib { opacity: .4; }
    .mapboxgl-ctrl-top-right { top: 14px; right: 14px; }
    .glass {
      background: var(--glass); border: 1px solid var(--glass-line);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    /* ── 左上：標題＋數字 ── */
    .panel {
      position: fixed; left: 16px; top: 16px; z-index: 2;
      width: min(380px, calc(100vw - 32px));
      max-height: calc(100vh - 32px); overflow-y: auto;
      padding: 16px 18px;
    }
    .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
      color: var(--ink2); font-size: 12px; text-decoration: none; }
    .brand img { width: 22px; height: 22px; border-radius: 6px; }
    h1 { margin: 0 0 4px; font-size: 20px; line-height: 1.3; }
    .day { margin: 0 0 8px; font-size: 12.5px; color: var(--cyan); font-weight: 600; }
    .sub { margin: 0 0 14px; color: var(--ink2); font-size: 13px; line-height: 1.6; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
    .stat { text-align: center; padding: 8px 4px; border-radius: 10px;
      background: rgba(255,255,255,.05); }
    .stat b { display: block; font-size: 19px; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 11px; color: var(--ink3); }
    .stat small { display: block; margin-top: 2px; font-size: 9.5px; letter-spacing: 0; white-space: nowrap;
      color: var(--ink2); font-variant-numeric: tabular-nums; }
    .cover { margin: 0 0 6px; font-size: 13px; color: var(--ink2); }
    .cover b { color: var(--ink); font-variant-numeric: tabular-nums; }
    .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--cyan); border-radius: 3px; width: 0;
      transition: width .8s ease; }

    h2 { margin: 18px 0 8px; font-size: 14px; color: var(--ink); }
    .contrib { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .contrib div { padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.05); }
    .contrib b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
    .contrib span { font-size: 11.5px; color: var(--ink3); line-height: 1.4; }
    .note { margin: 10px 0 0; font-size: 12.5px; color: var(--ink2); line-height: 1.65; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; font-size: 12px; color: var(--ink2); }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      margin-right: 6px; vertical-align: 0; border: 1px solid rgba(255,255,255,.85);
      box-shadow: 0 0 0 3px rgba(255,255,255,.06), 0 0 8px currentColor; }
    .invite { margin: 14px 0 0; font-size: 12.5px; color: var(--ink2); line-height: 1.65; }
    .invite a { color: var(--cyan); }
    .links { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
    .links a { font-size: 12.5px; color: var(--ink); text-decoration: none; padding: 7px 11px;
      border-radius: 999px; border: 1px solid var(--glass-line); background: rgba(255,255,255,.04); }
    .links a:hover { background: rgba(255,255,255,.1); }
    .credit { margin-top: 12px; font-size: 11px; color: var(--ink3); line-height: 1.5; }
    .credit a { color: var(--ink2); }

    .toggle { display: none; }

    /* ── 地圖模式：足跡／材質 ── */
    .modes { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 3;
      display: flex; gap: 2px; padding: 4px; border-radius: 999px; }
    .modes button { border: 0; background: transparent; color: var(--ink2); font: inherit;
      font-size: 13px; font-weight: 600; padding: 7px 16px; border-radius: 999px; cursor: pointer; }
    .modes button[aria-pressed="true"] { background: rgba(255,255,255,.14); color: var(--ink); }
    @media (min-width: 560px) { .modes { left: calc(50% + 200px); } }

    .rows { display: grid; gap: 6px; }
    .row { display: grid; grid-template-columns: 4.6em 1fr 3.4em; align-items: center; gap: 8px;
      font-size: 12.5px; color: var(--ink2); }
    .row .track { height: 7px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; }
    .row .track i { display: block; height: 100%; border-radius: 4px; }
    .row b { color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; font-size: 12.5px; }
    .pop-attrs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .pop-attrs span { font-size: 11.5px; padding: 3px 8px; border-radius: 999px;
      background: rgba(255,255,255,.08); color: var(--ink2); }
    .pop-attrs span.surf { color: #0d1116; font-weight: 700; }

    /* ── 點開一座球場 ── */
    .mapboxgl-popup-content { background: var(--glass); color: var(--ink);
      border: 1px solid var(--glass-line); border-radius: 14px; padding: 12px 14px;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 30px rgba(0,0,0,.4); min-width: 230px; max-width: 280px; }
    .mapboxgl-popup-tip { border-top-color: var(--glass) !important; border-bottom-color: var(--glass) !important; }
    .mapboxgl-popup-close-button { color: var(--ink2); font-size: 18px; padding: 2px 8px; }
    .pop-name { font-weight: 700; font-size: 14.5px; line-height: 1.35; padding-right: 14px; }
    .pop-meta { color: var(--ink3); font-size: 12px; margin-top: 2px; }
    .pop-people { margin-top: 8px; font-size: 13px; color: var(--ink2); }
    /* 大頭照一排，超出就往右滑；右緣漸層＋箭頭暗示還有，滑到底就消失。 */
    .faces-wrap { position: relative; margin-top: 8px; }
    .faces { display: flex; gap: 4px; overflow-x: auto; scroll-snap-type: x proximity;
      scrollbar-width: none; -webkit-overflow-scrolling: touch; padding-right: 2px; }
    .faces::-webkit-scrollbar { display: none; }
    .faces-wrap.more .faces { -webkit-mask-image: linear-gradient(90deg, #000 78%, transparent);
      mask-image: linear-gradient(90deg, #000 78%, transparent); }
    .faces-hint { position: absolute; right: -2px; top: 50%; transform: translateY(-50%);
      font-size: 16px; color: var(--ink2); pointer-events: none; opacity: 0; transition: opacity .2s; }
    .faces-wrap.more .faces-hint { opacity: 1; animation: nudge 1.6s ease-in-out infinite; }
    @keyframes nudge { 0%,100% { transform: translate(0,-50%); } 50% { transform: translate(3px,-50%); } }
    .pop-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 10px; }
    .pop-stats div { padding: 6px 4px; border-radius: 8px; background: rgba(255,255,255,.06); text-align: center; }
    .pop-stats b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
    .pop-stats span { font-size: 10.5px; color: var(--ink3); line-height: 1.3; display: block; }
    .pop-foot { margin-top: 6px; font-size: 10.5px; color: var(--ink3); }
    .faces img { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; object-fit: cover;
      border: 1.5px solid rgba(255,255,255,.25); background: #26313b; scroll-snap-align: start; }

    .loading { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
      background: #0d1116; transition: opacity .4s; }
    /* 跳動的球：同 /courts-map。ease-in 往下掉、alternate 反轉後上升自然減速；
       著地壓扁一點，影子跟著球的高度縮放。 */
    .loading .ball { font-size: 34px; line-height: 1;
      animation: ballBounce .55s cubic-bezier(.5,.05,1,.5) infinite alternate; }
    .loading .shadow { width: 30px; height: 6px; border-radius: 50%; background: #000;
      animation: ballShadow .55s cubic-bezier(.5,.05,1,.5) infinite alternate; }
    @keyframes ballBounce {
      from { transform: translateY(-30px); }
      to   { transform: translateY(0) scale(1.06, .9); }
    }
    @keyframes ballShadow {
      from { transform: scaleX(.5); opacity: .25; }
      to   { transform: scaleX(1);  opacity: .55; }
    }
    @media (prefers-reduced-motion: reduce) {
      .loading .ball, .loading .shadow { animation: none; }
    }
    .loading.done { opacity: 0; pointer-events: none; }
    .err { color: var(--ink2); font-size: 14px; text-align: center; padding: 0 24px; }

    @media (max-width: 559px) {
      .panel { left: 10px; right: 10px; top: auto; bottom: 10px; width: auto;
        max-height: 58vh; padding: 14px 14px 12px; }
      .panel.collapsed .more { display: none; }
      .toggle { display: block; width: 100%; margin-top: 10px; padding: 8px; border-radius: 10px;
        border: 1px solid var(--glass-line); background: rgba(255,255,255,.05);
        color: var(--ink2); font-size: 12.5px; }
      h1 { font-size: 17px; }
      .stat b { font-size: 16px; }
    }
  </style>
</head>
<body>

    <p class="sub" id="sub"></p>
    <div class="stats" id="stats"></div>

  <div class="modes glass" id="modes" hidden></div>

  <div class="loading" id="loading"><span class="ball">🎾</span><span class="shadow"></span></div>

  <script>

      en: {

      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    // 大頭照網址是使用者自己設的：只放 https，其他的不畫。
    const safeImg = (u) => /^https:\/\/[^\s"'<>]+$/i.test(u || "") ? u : null;
    const fmt = (n) => Number(n ?? 0).toLocaleString(LANG === "zh" ? "zh-TW" : "en");

    async function rpc(name) {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, {
        method: "POST",
        headers: { apikey: ANON, Authorization: "Bearer " + ANON, "Content-Type": "application/json" },
        body: "{}",
      });
      if (!r.ok) throw new Error(name + " " + r.status);
      return r.json();
    }

    // ── 文字 ───────────────────────────────────────────────────────────
    document.getElementById("title").textContent = T.title;
    document.getElementById("sub").textContent = T.sub;
    // 起算日＝App Store 上架（2026-08-31，Kayson 定）。不寫「上架」：Play 那時
    // 還在封閉測試。用台北的日曆日算，8/31 當天是第 1 天。
    (function () {
      const START = Date.UTC(2026, 7, 31);
      const tp = new Date(Date.now() + 8 * 3600e3);
      const today = Date.UTC(tp.getUTCFullYear(), tp.getUTCMonth(), tp.getUTCDate());
      const n = Math.floor((today - START) / 86400e3) + 1;
      if (n > 0) document.getElementById("day").textContent = T.day(n);
    })();
    document.getElementById("contribTitle").textContent = T.contribTitle;
    document.getElementById("credit").innerHTML = T.credit;
    // 材質配色跟 /courts-map 同一套，兩張地圖看起來是同一個產品。
    const SURF_COLORS = { hard: "#4FA8FF", clay: "#FF6A3D", grass: "#7ED957",
      artificial_grass: "#69C79A", omni: "#C9A66B", concrete: "#9AA3AA",
      pu: "#B98CD9", carpet: "#E38FB5", other: "#AEB6BD" };
    const surfKey = (c) => (c && SURF_COLORS[c]) ? c : "other";
    const dotKey = (k, c) => `<span><i style="background:${c};color:${c}"></i>${esc(k)}</span>`;
    function renderLegend(mode, tw) {
      const el = document.getElementById("legend");
      if (mode === "surface") {
        const seen = new Set((tw || []).map(r => surfKey(r.surface_code)));
        el.innerHTML = Object.keys(SURF_COLORS).filter(k => seen.has(k))
          .map(k => dotKey(T.surfaces[k], SURF_COLORS[k])).join("");
        return;
      }
      el.innerHTML = dotKey(T.legendCourt, "var(--cyan)") + dotKey(T.legendWall, "var(--wall)") +
        dotKey(T.legendIndoor, "var(--indoor)") + `<span>${esc(T.legendSize)}</span>`;
    }
    renderLegend("fp");
    document.getElementById("links").innerHTML =
      `<a href="/courts-map${LANG === "en" ? "?lang=en" : ""}">${esc(T.linkMap)}</a>`;
    document.getElementById("invite").innerHTML = T.invite;

    const panel = document.getElementById("panel");
    const toggle = document.getElementById("toggle");
    let mode = new URLSearchParams(location.search).get("mode") === "surface" ? "surface" : "fp";
    const moreLabel = () => mode === "surface" ? T.moreSurface : T.more;
    toggle.textContent = moreLabel();
    toggle.addEventListener("click", () => {
      const c = panel.classList.toggle("collapsed");
      toggle.textContent = c ? moreLabel() : T.less;
    });

    // codes：去過的國家代碼，場地多的排前面（TW · AU · JP · US）。
    function renderTotals(t, codes) {
      document.getElementById("stats").innerHTML = [
        [t.courts, T.courts], [t.people, T.people], [t.cities, T.cities], [t.countries, T.countries, codes],
      ].map(([n, l, extra]) => `<div class="stat"><b>${esc(fmt(n))}</b><span>${esc(l)}</span>` +
        (extra ? `<small>${esc(extra)}</small>` : "") + `</div>`).join("");
      const p = t.tw_courts ? Math.round(100 * t.tw_courts_visited / t.tw_courts) : 0;
      document.getElementById("cover").innerHTML =
        T.cover(esc(fmt(t.tw_courts_visited)), esc(fmt(t.tw_courts)), esc(p));
      requestAnimationFrame(() => { document.getElementById("coverBar").style.width = p + "%"; });
    }

    function renderContrib(c) {
      document.getElementById("contrib").innerHTML = [
        [c.courts_added, T.added], [c.walls_added, T.walls],
        [c.corrections_approved, T.corrections], [c.status_reports, T.status],
        [c.closure_reports, T.closures], [c.photos, T.photos],
      ].map(([n, l]) => `<div><b>${esc(fmt(n))}</b><span>${esc(l)}</span></div>`).join("");
      // 中位數是 0：更正大多在現場送出、當下生效。寫「0 天」看起來像資料壞掉。
      const d = Number(c.correction_median_days);
      const line = !isFinite(d) ? "" : d < 1 ? T.sameDay : T.medianDays(d.toFixed(1));
      document.getElementById("contribNote").textContent =
        (line ? line + "。" : "") + T.contributors(fmt(c.contributors));
    }

    // 縣市分區（同 FB 那篇「北硬南紅」的分法）；離島不列。
    const REGION = {
      north: ["台北市", "新北市", "基隆市", "桃園市", "新竹市", "新竹縣", "宜蘭縣"],
      central: ["苗栗縣", "台中市", "彰化縣", "南投縣", "雲林縣"],
      south: ["嘉義市", "嘉義縣", "台南市", "高雄市", "屏東縣"],
      east: ["花蓮縣", "台東縣"],
    };
    const bar = (label, pct, value, color) =>
      `<div class="row"><span>${esc(label)}</span><span class="track"><i style="width:${pct}%;background:${color}"></i></span><b>${esc(value)}</b></div>`;
    const pctOf = (a, b) => b ? Math.round(100 * a / b) : 0;
    const filled = (v) => v !== null && v !== undefined && v !== "";

    function renderSurface(tw) {
      const clay = tw.filter(r => r.surface_code === "clay").length;
      document.getElementById("clayTitle").textContent = T.clayTitle;
      document.getElementById("clayLead").textContent =
        T.clayLead(fmt(clay), fmt(tw.length), pctOf(clay, tw.length));
      document.getElementById("clayRows").innerHTML = Object.entries(REGION).map(([k, cities]) => {
        const v = tw.filter(r => cities.includes(r.city));
        const p = pctOf(v.filter(r => r.surface_code === "clay").length, v.length);
        return bar(T.regions[k], p, p + "%", SURF_COLORS.clay);
      }).join("");
      const cityPct = (c) => {
        const v = tw.filter(r => r.city === c);
        const name = LANG === "zh" ? c.replace(/[市縣]$/, "") : (v[0] && v[0].city_en) || c;
        return [name, pctOf(v.filter(r => r.surface_code === "clay").length, v.length)];
      };
      document.getElementById("clayCities").textContent =
        T.clayCities(["高雄市", "屏東縣", "台南市", "台北市"].map(cityPct));

      document.getElementById("compTitle").textContent = T.compTitle;
      document.getElementById("compRows").innerHTML = Object.keys(T.fields).map(f => {
        const p = pctOf(tw.filter(r => filled(r[f])).length, tw.length);
        return bar(T.fields[f], Math.max(p, 1), p + "%", "var(--cyan)");
      }).join("");
      document.getElementById("compNote").textContent = T.compNote;
    }

    async function fetchTaiwanCourts() {
      const q = new URLSearchParams({
        select: "id,name,city,city_en,lat,lng,surface_code,court_count,light,has_water,has_restroom," +
          "pricing_note,hours_text,access,address,tel,rental",
        country: "eq.TW", venue_kind: "eq.court",
        or: "(is_abandoned.is.null,is_abandoned.eq.false)",
      });
      const r = await fetch(`${SUPABASE_URL}/rest/v1/courts?${q}`, {
        headers: { apikey: ANON, Authorization: "Bearer " + ANON, Range: "0-9999" },
      });
      if (!r.ok) throw new Error("courts " + r.status);
      return r.json();
    }

    // ── 地圖 ───────────────────────────────────────────────────────────
    mapboxgl.accessToken = MAPBOX_TOKEN;
    const isMobile = window.matchMedia("(max-width: 559px)").matches;
    const map = new mapboxgl.Map({
      container: "map",
      style: "mapbox://styles/mapbox/satellite-v9",
      projection: "globe",
      center: [121.0, 23.7],
      zoom: isMobile ? 5.6 : 6.6,
      logoPosition: "bottom-right",
      attributionControl: false,
    });
    map.addControl(new mapboxgl.AttributionControl({ compact: true }), "bottom-right");
    map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), "top-right");
    // 純衛星、不帶任何標籤（街道版會帶出公路編號盾牌與國家公園圖示，
    // 跟足跡點搶眼）。影像壓暗、降飽和度，讓點當主角。
    map.on("style.load", () => {
      map.setFog({ color: "rgb(12,18,26)", "high-color": "rgb(20,40,70)",
        "horizon-blend": .04, "space-color": "rgb(4,6,10)", "star-intensity": .25 });
      for (const l of map.getStyle().layers) {
        if (l.type !== "raster") continue;
        map.setPaintProperty(l.id, "raster-brightness-max", .62);
        map.setPaintProperty(l.id, "raster-saturation", -.35);
        map.setPaintProperty(l.id, "raster-contrast", .08);
      }
    });

    // 開場視角：整座台灣（含澎湖）斜放在面板右邊，Kayson 2026-11-12 截圖定的。
    // 框的是固定的台灣範圍，不跟著點跑——原本用點去框，一個東京的點就把
    // 畫面拉到整個東海。海外、金門、馬祖的點照畫，只是不進開場的框。
    const TAIWAN = [[119.4, 21.85], [122.05, 25.32]];
    function camera() {
      map.fitBounds(TAIWAN, {
        bearing: -22, pitch: isMobile ? 20 : 32,
        padding: isMobile
          ? { top: 70, bottom: Math.round(window.innerHeight * 0.42), left: 20, right: 20 }
          : { top: 50, bottom: 40, left: 440, right: 80 },
        duration: 1400,
      });
    }

    function addLayers(rows) {
      map.addSource("fp", {
        type: "geojson",
        data: {
          type: "FeatureCollection",
          features: rows.map(r => ({
            type: "Feature",
            geometry: { type: "Point", coordinates: [r.lng, r.lat] },
            properties: {
              id: r.court_id, kind: r.venue_kind || "court",
              people: r.people || 0, label: r.people ? String(r.people) : "",
            },
          })),
        },
      });
      // 點的設計（2026-11-12 Kayson：原本實心白框圓「不清楚、沒有高級感」）：
      // 小而亮的核心＋很淡的同色光暈，像夜裡的燈；底圖壓暗讓點當主角。
      // 半徑仍跟人數開根號成正比（同 App），並隨縮放變大。
      //
      // Mapbox 的 zoom 內插只能放在最外層（包進 ["+"…] 會讓 addLayer 整個
      // 失敗），所以光暈與核心各寫一支完整的內插，不共用一個運算式。
      const n = ["sqrt", ["max", ["get", "people"], 1]];
      const at = (base, k) => ["+", base, ["*", k, ["-", n, 1]]];
      const core = ["interpolate", ["linear"], ["zoom"],
        4, at(2.2, 1.0), 8, at(3.6, 1.8), 13, at(6, 3)];
      const glow = ["interpolate", ["linear"], ["zoom"],
        4, at(6, 2.4), 8, at(10, 4.2), 13, at(16, 6.5)];
      const color = ["match", ["get", "kind"],
        "wall", "#D9A97A", "indoor_practice", "#F5C451", "#3FD4F2"];
      map.addLayer({
        id: "fp-glow", type: "circle", source: "fp",
        paint: {
          "circle-radius": glow, "circle-color": color,
          "circle-opacity": .22, "circle-blur": 1,
        },
      });
      map.addLayer({
        id: "fp-dot", type: "circle", source: "fp",
        layout: { "circle-sort-key": ["get", "people"] },
        paint: {
          "circle-radius": core, "circle-color": color,
          "circle-stroke-color": "rgba(255,255,255,.85)",
          "circle-stroke-width": ["interpolate", ["linear"], ["zoom"], 4, .6, 10, 1.2],
        },
      });
      // 人數：白字深色描邊，放在點的右上。互相壓到時人多的優先，其餘
      // 等放大再出現——台北那一團才不會疊成看不清的一塊。
      map.addLayer({
        id: "fp-count", type: "symbol", source: "fp",
        filter: [">=", ["get", "people"], 3],
        layout: {
          "text-field": ["get", "label"],
          "text-size": ["interpolate", ["linear"], ["zoom"], 5, 11, 12, 14],
          "text-font": ["DIN Pro Bold", "Arial Unicode MS Bold"],
          "text-anchor": "bottom-left",
          "text-offset": [0.35, -0.2],
          "text-allow-overlap": false,
          "symbol-sort-key": ["-", 0, ["get", "people"]],
        },
        paint: {
          "text-color": "#ffffff",
          "text-halo-color": "rgba(6,12,18,.9)", "text-halo-width": 1.6,
        },
      });
    }

    function addSurfaceLayers(tw) {
      map.addSource("tw", {
        type: "geojson",
        data: {
          type: "FeatureCollection",
          features: tw.filter(r => r.lat != null && r.lng != null).map(r => ({
            type: "Feature",
            geometry: { type: "Point", coordinates: [r.lng, r.lat] },
            properties: { id: r.id, surf: surfKey(r.surface_code) },
          })),
        },
      });
      const color = ["match", ["get", "surf"],
        ...Object.entries(SURF_COLORS).flat(), SURF_COLORS.other];
      // 紅土畫在上層：這個模式要讓人看到的就是紅土在哪裡。
      const sort = ["match", ["get", "surf"], "clay", 2, "hard", 1, 0];
      map.addLayer({
        id: "tw-glow", type: "circle", source: "tw", layout: { visibility: "none", "circle-sort-key": sort },
        paint: { "circle-radius": ["interpolate", ["linear"], ["zoom"], 4, 4, 8, 7, 13, 14],
          "circle-color": color, "circle-opacity": .2, "circle-blur": 1 },
      });
      map.addLayer({
        id: "tw-dot", type: "circle", source: "tw", layout: { visibility: "none", "circle-sort-key": sort },
        paint: { "circle-radius": ["interpolate", ["linear"], ["zoom"], 4, 1.8, 8, 3.2, 13, 6],
          "circle-color": color, "circle-stroke-color": "rgba(255,255,255,.7)",
          "circle-stroke-width": ["interpolate", ["linear"], ["zoom"], 4, .3, 10, 1] },
      });
    }

    const FP_LAYERS = ["fp-glow", "fp-dot", "fp-count"], TW_LAYERS = ["tw-glow", "tw-dot"];
    function applyMode(tw) {
      const vis = (ids, on) => ids.forEach(id => map.getLayer(id) &&
        map.setLayoutProperty(id, "visibility", on ? "visible" : "none"));
      vis(FP_LAYERS, mode === "fp");
      vis(TW_LAYERS, mode === "surface");
      document.getElementById("secFp").hidden = mode !== "fp";
      document.getElementById("secSurface").hidden = mode !== "surface";
      renderLegend(mode, tw);
      if (panel.classList.contains("collapsed")) toggle.textContent = moreLabel();
      [...document.querySelectorAll("#modes button")].forEach(b =>
        b.setAttribute("aria-pressed", String(b.dataset.m === mode)));
      try {
        const u = new URL(location.href);
        if (mode === "surface") u.searchParams.set("mode", "surface"); else u.searchParams.delete("mode");
        history.replaceState(null, "", u);
      } catch (_) {}
    }

    // 資訊卡：球場屬性只寫有填的；足跡的部分只有去過的場地才有。
    function attrsHtml(t) {
      if (!t) return "";
      const out = [];
      if (t.surface_code) {
        const k = surfKey(t.surface_code);
        out.push(`<span class="surf" style="background:${SURF_COLORS[k]}">${esc(T.surfaces[k] || t.surface_code)}</span>`);
      }
      if (t.court_count) out.push(`<span>${esc(T.attrCourts(t.court_count))}</span>`);
      if (t.light === true) out.push(`<span>${esc(T.attrLight)}</span>`);
      if (t.light === false) out.push(`<span>${esc(T.attrNoLight)}</span>`);
      if (t.has_restroom === true) out.push(`<span>${esc(T.attrRestroom)}</span>`);
      if (t.has_water === true) out.push(`<span>${esc(T.attrWater)}</span>`);
      if (filled(t.pricing_note)) {
        const fee = String(t.pricing_note).trim();
        out.push(`<span>${esc(T.attrFee(fee.length > 28 ? fee.slice(0, 27) + "…" : fee))}</span>`);
      }
      return out.length ? `<div class="pop-attrs">${out.join("")}</div>` : "";
    }

    function popupHtml(r, t) {
      if (!r) {
        const city = LANG === "zh" ? t.city : (t.city_en || t.city);
        return `<div class="pop-name">${esc(t.name)}</div>
          <div class="pop-meta">${[city, T.kind.court].filter(Boolean).map(esc).join(" · ")}</div>
          ${attrsHtml(t)}
          <div class="pop-people">${esc(T.notYet)}</div>`;
      }
      const kind = T.kind[r.venue_kind] || T.kind.court;
      const where = [r.city, kind].filter(Boolean).map(esc).join(" · ");
      const faces = (r.avatars || []).map(safeImg).filter(Boolean)
        .map(u => `<img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()" />`)
        .join("");
      // 練習紀錄與 GPS 到場分開寫：練習可以在家補記，只有停留確認的打卡有
      // GPS 背書。欄位還沒有的時候（舊版查詢）整列不畫。
      const has = r.practices != null;
      const stats = !has ? "" : `<div class="pop-stats">${[
          [r.practices, T.popPractices], [r.verified_visits, T.popVerified], [r.updates, T.popUpdates],
        ].map(([v, l]) => `<div><b>${esc(fmt(v))}</b><span>${esc(l)}</span></div>`).join("")}</div>` +
        (r.photos > 0 ? `<div class="pop-foot">${esc(T.popPhotos(r.photos))}</div>` : "");
      return `<div class="pop-name">${esc(r.name)}</div>
        <div class="pop-meta">${where}</div>
        ${attrsHtml(t)}
        <div class="pop-people">${esc(r.people ? T.peopleN(r.people) : T.peopleFew)}</div>
        ${faces ? `<div class="faces-wrap"><div class="faces">${faces}</div><span class="faces-hint">›</span></div>` : ""}
        ${stats}`;
    }

    // 頭像超出寬度才出現漸層與箭頭；滑到接近底就收掉。圖片載入失敗會被
    // 移除，寬度跟著變，所以載入完也再量一次。
    function hintFaces(root) {
      const wrap = root && root.querySelector(".faces-wrap");
      if (!wrap) return;
      const row = wrap.querySelector(".faces");
      const check = () => wrap.classList.toggle("more",
        row.scrollWidth - row.clientWidth - row.scrollLeft > 6);
      row.addEventListener("scroll", check, { passive: true });
      row.querySelectorAll("img").forEach(img => {
        img.addEventListener("load", check); img.addEventListener("error", () => setTimeout(check));
      });
      requestAnimationFrame(check);
    }

    (async function main() {
      const loading = document.getElementById("loading");
      let rows, totals, contrib, tw;
      try {
        [rows, totals, contrib, tw] = await Promise.all([
          rpc("public_footprint_map"), rpc("public_footprint_totals"), rpc("public_contribution_stats"),
          fetchTaiwanCourts().catch(() => []),
        ]);
      } catch (e) {
        loading.innerHTML = `<div class="err">${esc(T.failed)}</div>`;
        return;
      }
      const byCountry = {};
      rows.forEach(r => { if (r.country) byCountry[r.country] = (byCountry[r.country] || 0) + 1; });
      renderTotals(totals[0] || {},
        Object.entries(byCountry).sort((a, b) => b[1] - a[1]).map(([c]) => c).join(" "));
      renderContrib(contrib[0] || {});
      if (tw.length) renderSurface(tw);
      const byId = new Map(rows.map(r => [r.court_id, r]));
      const twById = new Map(tw.map(r => [r.id, r]));

      const modes = document.getElementById("modes");
      if (tw.length) {
        modes.innerHTML = [["fp", T.modeFp], ["surface", T.modeSurface]]
          .map(([m, l]) => `<button type="button" data-m="${m}">${esc(l)}</button>`).join("");
        modes.hidden = false;
      } else mode = "fp";

      const ready = () => {
        addLayers(rows);
        if (tw.length) addSurfaceLayers(tw);
        applyMode(tw);
        loading.classList.add("done");
        camera();
      };
      modes.addEventListener("click", (ev) => {
        const b = ev.target.closest("button");
        if (!b || b.dataset.m === mode) return;
        mode = b.dataset.m;
        if (popup) popup.remove();
        applyMode(tw);
      });
      if (map.isStyleLoaded()) ready(); else map.once("load", ready);

      var popup = null;
      // 核心點變小了，連光暈一起算可點範圍，手機上才點得到。
      const hit = tw.length ? ["fp-dot", "fp-glow", "tw-dot", "tw-glow"] : ["fp-dot", "fp-glow"];
      map.on("click", hit, (ev) => {
        const f = ev.features && ev.features[0];
        if (!f) return;
        const r = byId.get(f.properties.id), t = twById.get(f.properties.id);
        if (!r && !t) return;
        if (popup) popup.remove();
        popup = new mapboxgl.Popup({ offset: 12, maxWidth: "280px" })
          .setLngLat([(r || t).lng, (r || t).lat]).setHTML(popupHtml(r, t)).addTo(map);
        hintFaces(popup.getElement());
      });
      map.on("mouseenter", hit, () => { map.getCanvas().style.cursor = "pointer"; });
      map.on("mouseleave", hit, () => { map.getCanvas().style.cursor = ""; });
    })();
  </script>
</body>
</html>
