<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect x="4" y="4" width="352" height="202" rx="34" fill="#DEDACE"/>
  <rect x="8" y="8" width="344" height="194" rx="30" fill="#FBFAF6"/>
  <rect x="154.0" y="20" width="52" height="5" rx="2.5" fill="#C9C5B8"/>
  <text x="28" y="54" font-size="16" fill="#007C72" font-weight="800" text-anchor="start">設定</text>
  <text x="28" y="74" font-size="11" fill="#9BA29B" font-weight="600" text-anchor="start">隱私</text>
  <rect x="20" y="82" width="320" height="104" rx="14" fill="#FFFFFF" stroke="#ECEAE2"/>
  <text x="36" y="112" font-size="13.5" fill="#007C72" font-weight="700" text-anchor="start">讓附近的球友看得到我</text>
  <text x="36" y="136" font-size="11" fill="#9BA29B" font-weight="500" text-anchor="start">球場人數算你一個，球場卡和</text>
  <text x="36" y="154" font-size="11" fill="#9BA29B" font-weight="500" text-anchor="start">「這一帶的球友」會出現你的名字和程度。</text>
  <text x="36" y="172" font-size="11" fill="#9BA29B" font-weight="500" text-anchor="start">關掉後你也看不到他們。</text>
  <rect x="272" y="98" width="52" height="30" rx="15" fill="#00695F"/>
  <circle cx="309" cy="113" r="12" fill="#FFFFFF"/>
</svg>
