<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 364" role="img" aria-label="附影片給教練" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect x="4" y="4" width="352" height="356" rx="34" fill="#DEDACE"/>
  <rect x="8" y="8" width="344" height="348" rx="30" fill="#FBFAF6"/>
  <rect x="154" y="20" width="52" height="5" rx="2.5" fill="#C9C5B8"/>

  <text x="34" y="62" font-size="16" fill="#1B5138" font-weight="800">附一段影片</text>
  <line x1="34" y1="80" x2="326" y2="80" stroke="#ECEAE2"/>

  <!-- 額度說明 -->
  <rect x="34" y="96" width="292" height="62" rx="12" fill="#EEF4EC" stroke="#DCE8D9"/>
  <circle cx="58" cy="118" r="8" fill="#3F7C43"/>
  <text x="58" y="122" font-size="10" fill="#FFFFFF" text-anchor="middle">i</text>
  <text x="76" y="122" font-size="12" fill="#2F6B3C" font-weight="700">本月還可上傳 2 支，每支最長 30 秒</text>
  <text x="76" y="144" font-size="11.5" fill="#B07A2A">🕒  30 天後自動刪除</text>

  <!-- 兩個來源 -->
  <rect x="34" y="172" width="292" height="52" rx="12" fill="#FFFFFF" stroke="#ECEAE2"/>
  <circle cx="60" cy="198" r="15" fill="#3F7C43" opacity="0.14"/>
  <text x="60" y="203" font-size="13" text-anchor="middle">🎥</text>
  <text x="86" y="194" font-size="13" fill="#1B5138" font-weight="700">現在錄一段</text>
  <text x="86" y="212" font-size="11" fill="#9BA29B">最長 30 秒</text>

  <rect x="34" y="232" width="292" height="52" rx="12" fill="#FFFFFF" stroke="#ECEAE2"/>
  <circle cx="60" cy="258" r="15" fill="#3F7C43" opacity="0.14"/>
  <text x="60" y="263" font-size="13" text-anchor="middle">🖼</text>
  <text x="86" y="254" font-size="13" fill="#1B5138" font-weight="700">從相簿選</text>
  <text x="86" y="272" font-size="11" fill="#9BA29B">太大或太長會先告訴你</text>

  <!-- 貼連結 -->
  <rect x="34" y="294" width="292" height="44" rx="12" fill="#FFFFFF" stroke="#ECEAE2" stroke-dasharray="4 3"/>
  <text x="52" y="321" font-size="12" fill="#9BA29B">🔗  YouTube / Drive / 影片網址</text>
</svg>
