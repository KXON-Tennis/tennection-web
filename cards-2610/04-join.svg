<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1080" height="1080" fill="#FBFAF6"/>
  <rect width="1080" height="14" fill="#1B5138"/>
  <text x="80" y="170" font-size="72" font-weight="800" fill="#1B5138">加入球隊，先打聲招呼</text>
  <text x="80" y="228" font-size="34" fill="#6E776F">附一句話，隊長看了再核准</text>
  <rect x="80" y="286" width="920" height="300" rx="34" fill="#FFFFFF" stroke="#ECEAE2" stroke-width="2"/>
  <text x="128" y="350" font-size="32" font-weight="800" fill="#1B5138">2 人申請加入</text>
  <line x1="128" y1="378" x2="952" y2="378" stroke="#F1F0EA" stroke-width="2"/>
  <circle cx="162" cy="436" r="34" fill="#E7F1E1"/>
  <text x="162" y="446" font-size="28" text-anchor="middle" fill="#3F7C43" font-weight="800">陳</text>
  <text x="216" y="428" font-size="32" font-weight="700" fill="#2E5A34">陳柏宇</text>
  <text x="216" y="472" font-size="26" fill="#6E776F">「我也常在青年公園打球，想加入一起練」</text>
  <rect x="636" y="502" width="150" height="58" rx="16" fill="#3F7C43"/>
  <text x="711" y="540" font-size="27" font-weight="800" fill="#FFFFFF" text-anchor="middle">核准</text>
  <rect x="802" y="502" width="150" height="58" rx="16" fill="#FFFFFF" stroke="#DCD9CF" stroke-width="2"/>
  <text x="877" y="540" font-size="27" font-weight="700" fill="#6E776F" text-anchor="middle">婉拒</text>
  <rect x="80" y="614" width="920" height="150" rx="34" fill="#F3F8EC" stroke="#DCE8C8" stroke-width="2"/>
  <text x="128" y="676" font-size="27" fill="#7C9A6E">不知道寫什麼？</text>
  <text x="128" y="738" font-size="36" font-weight="800" fill="#2E5A34">有建議句可以一鍵帶入</text>
  <rect x="80" y="790" width="920" height="110" rx="30" fill="#FFFFFF" stroke="#ECEAE2" stroke-width="2"/>
  <text x="128" y="844" font-size="30" fill="#5E7A60">拿到邀請碼的人還是可以直接加入，</text>
  <text x="128" y="884" font-size="30" fill="#5E7A60">隊長會收到通知。</text>
  <text x="540" y="1012" font-size="32" text-anchor="middle" fill="#9BA29B">Your tennis life, <tspan fill="#1B5138" font-weight="800">connected.</tspan></text>
</svg>
