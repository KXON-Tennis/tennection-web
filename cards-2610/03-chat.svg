<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1080" height="1080" fill="#FBFAF6"/>
  <rect width="1080" height="14" fill="#1B5138"/>
  <text x="80" y="170" font-size="72" font-weight="800" fill="#1B5138">隊裡說一聲就好</text>
  <text x="80" y="228" font-size="34" fill="#6E776F">每一隊都有自己的對話，只有隊員看得到</text>
  <rect x="80" y="286" width="920" height="460" rx="34" fill="#FFFFFF" stroke="#ECEAE2" stroke-width="2"/>
  <text x="128" y="350" font-size="32" font-weight="800" fill="#1B5138">球隊對話</text>
  <text x="952" y="350" font-size="26" fill="#9BA29B" text-anchor="end">週末早鳥隊</text>
  <rect x="380" y="380" width="320" height="50" rx="25" fill="#F1F0EA"/>
  <text x="540" y="414" font-size="25" fill="#6E776F" text-anchor="middle">小葉 加入了球隊</text>
  <circle cx="160" cy="494" r="30" fill="#E7F1E1"/>
  <text x="160" y="503" font-size="26" text-anchor="middle" fill="#3F7C43" font-weight="800">阿</text>
  <text x="208" y="474" font-size="23" fill="#9BA29B">阿凱</text>
  <rect x="204" y="484" width="420" height="64" rx="26" fill="#F7F6F1" stroke="#ECEAE2" stroke-width="2"/>
  <text x="232" y="527" font-size="29" fill="#2E5A34">這週六早上誰要來？</text>
  <circle cx="160" cy="610" r="30" fill="#E7F1E1"/>
  <text x="160" y="619" font-size="26" text-anchor="middle" fill="#3F7C43" font-weight="800">A</text>
  <text x="208" y="590" font-size="23" fill="#9BA29B">Amy Chen</text>
  <rect x="204" y="600" width="460" height="64" rx="26" fill="#F7F6F1" stroke="#ECEAE2" stroke-width="2"/>
  <text x="232" y="643" font-size="29" fill="#2E5A34">我 +1，我帶一筒新球</text>
  <rect x="552" y="672" width="400" height="56" rx="26" fill="#3F7C43"/>
  <text x="580" y="710" font-size="28" fill="#FFFFFF">8 點青年公園，老位置見</text>
  <rect x="80" y="772" width="920" height="150" rx="34" fill="#F3F8EC" stroke="#DCE8C8" stroke-width="2"/>
  <text x="128" y="834" font-size="27" fill="#7C9A6E">練球時間、誰帶球、這週去哪裡打</text>
  <text x="128" y="896" font-size="36" font-weight="800" fill="#2E5A34">不用另外開群組</text>
  <text x="540" y="1012" font-size="32" text-anchor="middle" fill="#9BA29B">Your tennis life, <tspan fill="#1B5138" font-weight="800">connected.</tspan></text>
</svg>
