<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1080" height="1080" fill="#FBFAF6"/>
  <rect width="1080" height="14" fill="#1B5138"/>
  <text x="80" y="170" font-size="72" font-weight="800" fill="#1B5138">約好的球可以改</text>
  <text x="80" y="228" font-size="34" fill="#6E776F">時間、內容、程度，發出之後都能改</text>
  <rect x="80" y="286" width="920" height="470" rx="34" fill="#FFFFFF" stroke="#ECEAE2" stroke-width="2"/>
  <text x="128" y="352" font-size="34" font-weight="800" fill="#1B5138">修改約球</text>
  <text x="128" y="396" font-size="27" fill="#9BA29B">青年公園網球場 · 10/12 (日) 08:00</text>
  <line x1="128" y1="426" x2="952" y2="426" stroke="#F1F0EA" stroke-width="2"/>
  <text x="128" y="474" font-size="31" font-weight="700" fill="#2E5A34">修改時間與內容</text>
  <text x="128" y="512" font-size="25" fill="#9BA29B">想打什麼、用球、程度都能改</text>
  <path d="M940 467 l12 12 l-12 12" fill="none" stroke="#9BA29B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="128" y1="532" x2="952" y2="532" stroke="#F1F0EA" stroke-width="2"/>
  <text x="128" y="580" font-size="31" font-weight="700" fill="#2E5A34">再找人</text>
  <text x="128" y="618" font-size="25" fill="#9BA29B">指名幾位好友，他們會收到「你約他」</text>
  <path d="M940 573 l12 12 l-12 12" fill="none" stroke="#9BA29B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="128" y1="638" x2="952" y2="638" stroke="#F1F0EA" stroke-width="2"/>
  <text x="128" y="686" font-size="31" font-weight="700" fill="#2E5A34">讓更多人看到</text>
  <text x="128" y="724" font-size="25" fill="#9BA29B">放寬之前會先確認一次</text>
  <path d="M940 679 l12 12 l-12 12" fill="none" stroke="#9BA29B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="80" y="786" width="920" height="150" rx="34" fill="#F3F8EC" stroke="#DCE8C8" stroke-width="2"/>
  <text x="128" y="848" font-size="27" fill="#7C9A6E">改完之後</text>
  <text x="128" y="906" font-size="36" font-weight="800" fill="#2E5A34">已報名的人都會收到通知</text>
  <text x="540" y="1012" font-size="32" text-anchor="middle" fill="#9BA29B">Your tennis life, <tspan fill="#1B5138" font-weight="800">connected.</tspan></text>
</svg>
