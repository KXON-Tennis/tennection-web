<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect x="4" y="4" width="352" height="182" rx="26" fill="#DEDACE"/>
  <rect x="8" y="8" width="344" height="174" rx="22" fill="#FBFAF6"/>
  <text x="180" y="40" font-size="12.5" fill="#9BA29B" text-anchor="middle">畫面最下面這一排，由左到右</text>

  <line x1="24" y1="64" x2="336" y2="64" stroke="#ECEAE2"/>

  <!-- 首頁 -->
  <path d="M56 104 l14 -12 l14 12 v14 h-10 v-9 h-8 v9 h-10 z" fill="none" stroke="#6E776F" stroke-width="2" stroke-linejoin="round"/>
  <text x="70" y="140" font-size="11.5" fill="#6E776F" font-weight="600" text-anchor="middle">首頁</text>

  <!-- 諮詢 -->
  <rect x="112" y="94" width="24" height="18" rx="5" fill="none" stroke="#6E776F" stroke-width="2"/>
  <path d="M118 112 v6 l7 -6" fill="none" stroke="#6E776F" stroke-width="2" stroke-linejoin="round"/>
  <text x="124" y="140" font-size="11.5" fill="#6E776F" font-weight="600" text-anchor="middle">諮詢</text>

  <!-- ＋ -->
  <circle cx="180" cy="104" r="21" fill="none" stroke="#3F7C43" stroke-width="2.4"/>
  <path d="M180 95 v18 M171 104 h18" stroke="#3F7C43" stroke-width="2.6" stroke-linecap="round"/>
  <text x="180" y="140" font-size="11.5" fill="#3F7C43" font-weight="700" text-anchor="middle">新增</text>

  <!-- 探索 -->
  <circle cx="236" cy="104" r="12" fill="none" stroke="#6E776F" stroke-width="2"/>
  <path d="M241 99 l-4 10 l-10 4 l4 -10 z" fill="#6E776F"/>
  <text x="236" y="140" font-size="11.5" fill="#6E776F" font-weight="600" text-anchor="middle">探索／紀錄</text>

  <!-- 護照（目前所在） -->
  <rect x="272" y="86" width="52" height="36" rx="14" fill="#E4F0E2"/>
  <circle cx="298" cy="99" r="5" fill="#1B5138"/>
  <path d="M289 112 a9 9 0 0 1 18 0 z" fill="#1B5138"/>
  <text x="298" y="140" font-size="11.5" fill="#1B5138" font-weight="700" text-anchor="middle">護照</text>

  <text x="180" y="166" font-size="11" fill="#9BA29B" text-anchor="middle">下面每一步都會說清楚在哪一個分頁</text>
</svg>
