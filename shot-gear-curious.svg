<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect x="4" y="4" width="352" height="392" rx="34" fill="#DEDACE"/>
  <rect x="8" y="8" width="344" height="384" rx="30" fill="#FBFAF6"/>
  <rect x="154" y="20" width="52" height="5" rx="2.5" fill="#C9C5B8"/>

  <!-- 名單上的一列：主拍、主鞋、舉手 -->
  <rect x="16" y="46" width="328" height="104" rx="16" fill="#FFFFFF" stroke="#ECEAE2"/>
  <circle cx="50" cy="80" r="16" fill="#E3E9D8"/>
  <text x="50" y="85" font-size="12" fill="#3F7C43" font-weight="800" text-anchor="middle">林</text>
  <text x="76" y="78" font-size="13.5" fill="#2E5A34" font-weight="700">林家瑋</text>
  <text x="76" y="96" font-size="11.5" fill="#5C9A46" font-weight="700">NTRP 3.5</text>
  <text x="76" y="120" font-size="12" fill="#9BA29B">Wilson Pro Staff 97 v14</text>
  <text x="76" y="140" font-size="12" fill="#9BA29B">Asics Gel-Resolution 9</text>
  <!-- 舉手圖示 -->
  <g transform="translate(244 108)" fill="none" stroke="#3F7C43" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 9 V3.5 a1.3 1.3 0 0 1 2.6 0 V8 M5.6 7 V2 a1.3 1.3 0 0 1 2.6 0 V7.5 M8.2 7.5 V3 a1.3 1.3 0 0 1 2.6 0 V9 l1.3-1.6 a1.3 1.3 0 0 1 2 1.6 l-2.6 4 a4.5 4.5 0 0 1-3.8 2 H7 a4 4 0 0 1-4-4 Z"/>
  </g>

  <!-- 按下去之後的確認 -->
  <rect x="28" y="170" width="304" height="194" rx="22" fill="#FFFFFF" stroke="#DCD9CF"/>
  <text x="48" y="204" font-size="15" fill="#1B5138" font-weight="800">想聽聽這件裝備的心得嗎？</text>
  <text x="48" y="232" font-size="14" fill="#2E5A34" font-weight="700">Wilson Pro Staff 97 v14</text>
  <text x="48" y="260" font-size="12" fill="#6E776F">投一票給他。他會知道有幾位球友想聽，</text>
  <text x="48" y="280" font-size="12" fill="#6E776F">但不會知道是誰；寫好心得時會通知你。</text>
  <text x="206" y="336" font-size="13" fill="#6E776F" text-anchor="middle">取消</text>
  <rect x="236" y="314" width="80" height="34" rx="17" fill="#3F7C43"/>
  <text x="276" y="336" font-size="13" fill="#FFFFFF" font-weight="800" text-anchor="middle">投一票</text>
  <text x="180" y="429" font-size="13" text-anchor="middle" fill="#9BA29B" letter-spacing="0.2">Your tennis life, <tspan fill="#1B5138" font-weight="800">connected.</tspan></text>
</svg>
