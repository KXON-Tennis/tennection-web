<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect x="4" y="4" width="352" height="312" rx="30" fill="#DEDACE"/>
  <rect x="8" y="8" width="344" height="304" rx="26" fill="#2B2F33"/>
  <g opacity="0.32" stroke="#4A5058" stroke-width="1.4">
    <path d="M8 118 H352 M8 208 H352 M108 8 V312 M246 8 V312"/>
  </g>

  <!-- 搜尋列 -->
  <rect x="24" y="24" width="226" height="32" rx="16" fill="#FBFAF6"/>
  <circle cx="45" cy="40" r="6" fill="none" stroke="#9BA29B" stroke-width="1.6"/>
  <line x1="49" y1="44" x2="54" y2="49" stroke="#9BA29B" stroke-width="1.6"/>
  <text x="64" y="45" font-size="12" fill="#9BA29B">搜尋球場</text>

  <!-- 篩選晶片：球友在線 被選中 -->
  <rect x="24" y="66" width="94" height="30" rx="15" fill="#FFA726"/>
  <text x="71" y="86" font-size="12" fill="#2B2F33" font-weight="800" text-anchor="middle">🔥 球友在線</text>
  <rect x="126" y="66" width="74" height="30" rx="15" fill="#FBFAF6"/>
  <text x="163" y="86" font-size="12" fill="#3F4A41" font-weight="600" text-anchor="middle">我的最愛</text>
  <rect x="208" y="66" width="58" height="30" rx="15" fill="#FBFAF6"/>
  <text x="237" y="86" font-size="12" fill="#3F4A41" font-weight="600" text-anchor="middle">球隊</text>
  <rect x="274" y="66" width="58" height="30" rx="15" fill="#FBFAF6"/>
  <text x="303" y="86" font-size="12" fill="#3F4A41" font-weight="600" text-anchor="middle">室內</text>

  <circle cx="71" cy="81" r="27" fill="none" stroke="#E8590C" stroke-width="3"/>
  <circle cx="44" cy="60" r="13" fill="#E8590C"/>
  <text x="44" y="65" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle">1</text>

  <!-- 篩選之後：地圖上只剩現在有人的球場 -->
  <circle cx="120" cy="168" r="11" fill="#FFA726" stroke="#FFFFFF" stroke-width="2"/>
  <text x="120" y="196" font-size="11" fill="#FFD79A" font-weight="700" text-anchor="middle">3 人在打</text>
  <circle cx="252" cy="238" r="10" fill="#FFA726" stroke="#FFFFFF" stroke-width="2"/>
  <text x="252" y="264" font-size="11" fill="#FFD79A" font-weight="700" text-anchor="middle">1 人在打</text>

  <text x="24" y="298" font-size="11.5" fill="#C9CFC9">按下去，地圖上只留下此刻真的有人在打球的球場。</text>
</svg>
