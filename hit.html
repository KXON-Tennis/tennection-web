<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>一起打球？ · Tennis Nut</title>
  <meta name="description" content="有人約你打球。時間、場地、要打什麼、用哪種球，都已經先講好了。" />
  <meta property="og:title" content="一起打球？" />
  <meta property="og:description" content="時間、場地、要打什麼、用哪種球，都已經先講好了。" />
  <meta property="og:image" content="https://tennisnut.kxon.net/app-features.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- An invitation is for one person and expires; keeping it out of search
       results costs nothing and avoids stale links ranking. -->
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .wrap { max-width: 460px; margin: 0 auto; }

    .state { text-align: center; padding: 60px 10px; color: var(--text-tertiary); font-size: 14px; }
    .state .big { font-size: 34px; line-height: 1; margin-bottom: 12px; }
    .state h1 { font-size: 19px; color: var(--text-primary); margin: 0 0 8px; }
    .state p { margin: 0 auto 20px; max-width: 320px; line-height: 1.65;
      color: var(--text-secondary); font-size: 14px; }

    /* ── The session ── */
    .invite { background: var(--surface); border: 2px solid var(--accent);
      border-radius: 20px; padding: 22px 20px; }
    .from { font-size: 13px; color: var(--text-secondary); margin: 0 0 4px; }
    .from b { color: var(--text-primary); }
    .when { font-size: 25px; font-weight: 900; color: var(--text-primary);
      line-height: 1.25; margin: 0 0 2px; letter-spacing: -.3px; }
    .when-rel { font-size: 13px; font-weight: 700; color: var(--accent-d); margin: 0 0 16px; }

    /* What we're going to do — the two things agreed in advance, which is the
       whole reason this invitation exists. Given the visual weight to match. */
    .agreed { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .ag { background: var(--tint); border: 1px solid #DCEAC9; border-radius: 14px;
      padding: 12px 13px; }
    .ag .lb { font-size: 11px; font-weight: 800; letter-spacing: .4px;
      color: var(--text-tertiary); text-transform: uppercase; margin-bottom: 5px; }
    .ag .vl { font-size: 15.5px; font-weight: 800; color: var(--text-primary); line-height: 1.3; }
    .ag .bl { font-size: 12px; color: var(--text-secondary); line-height: 1.45; margin-top: 4px; }

    .beginner { display: flex; gap: 10px; align-items: flex-start;
      background: #FFF9E8; border: 1px solid #EBDCA9; border-radius: 14px;
      padding: 12px 14px; margin-bottom: 14px; }
    .beginner .ic { font-size: 18px; line-height: 1.2; flex: 0 0 auto; }
    .beginner b { display: block; font-size: 14px; color: var(--text-primary); }
    .beginner span { font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; }

    .going { font-size: 13px; color: var(--text-secondary); margin: 0; }

    /* ── The court ── */
    .court { background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 18px 18px 16px; margin-top: 16px; }
    .court h2 { margin: 0 0 2px; font-size: 17px; color: var(--text-primary); }
    .court .city { margin: 0 0 12px; font-size: 13px; color: var(--text-tertiary); }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
    .chip { font-size: 12px; font-weight: 700; color: var(--text-secondary);
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 999px; padding: 5px 11px; }
    .chip.ok { color: var(--accent-d); background: var(--accent-soft); border-color: transparent; }
    .maplink { display: inline-flex; align-items: center; gap: 7px;
      font-size: 14px; font-weight: 800; color: var(--accent-d); text-decoration: none; }

    /* ── Getting in ── */
    .act { margin-top: 22px; text-align: center; }
    .act .btn { display: block; background: var(--accent); color: #fff;
      font-weight: 800; font-size: 16px; padding: 14px 22px; border-radius: 999px;
      text-decoration: none; box-shadow: 0 6px 18px rgba(92,154,70,.28); }
    .act .how { margin: 14px 0 0; font-size: 12.5px; color: var(--text-tertiary);
      line-height: 1.7; }
    .act .how b { color: var(--text-secondary); }

    .langbar { text-align: center; margin: 26px 0 0; font-size: 12px; }
    .langbar a { color: var(--text-tertiary); text-decoration: none; font-weight: 700; }
    .langbar a[aria-current] { color: var(--accent-d); }

    @media (max-width: 380px) { .agreed { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="/" class="brand-link">
      <img src="/wordmark.png" alt="Tennis Nut" class="brand-wordmark" />
    </a>
    <nav>
      <a href="/join">加入</a>
      <a href="/courts-map">球場地圖</a>
      <a href="/privacy">隱私權</a>
    </nav>
  </header>

  <main class="container">
    <div class="wrap" id="wrap">
      <div class="state" id="loading"><div class="big">🎾</div><span id="loadingTx"></span></div>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <div class="footer-text">
        <a href="/join">加入</a>·
        <a href="/courts-map">球場地圖</a>·
        <a href="/privacy">隱私權政策</a>·
        <a href="/terms">服務條款</a>
        <div style="margin-top: 12px;">© 2026 Tennis Nut · KXON</div>
      </div>
    </div>
  </footer>

  <script>
    const SUPABASE_URL = "https://dwjwisgbpnrxtcvpbkec.supabase.co";
    const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3andpc2dicG5yeHRjdnBia2VjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0NTU2ODQsImV4cCI6MjA4NDAzMTY4NH0.Em6SlZlakgd8WlL-PgFsR-NjpN2HFc38yNUw1zRKB9I";

    const params = new URLSearchParams(location.search);
    const TOKEN = params.get("t");

    const LANG = (function () {
      const q = params.get("lang");
      if (q === "en" || q === "zh") return q;
      return /^zh/i.test(navigator.language || "") ? "zh" : "en";
    })();
    document.documentElement.lang = LANG === "zh" ? "zh-Hant" : "en";

    // The wording is lifted from the app's ARB rather than rewritten, so the
    // person who tapped share and the person who opens the link are reading
    // the same sentences about the same session.
    const T = {
      zh: {
        loading: "正在打開邀請…",
        goneTitle: "這個邀請已經結束了",
        goneBody: "可能是時間已過、主辦人取消了，或是連結不完整。可以直接問問分享給你的人。",
        badTitle: "連結不完整",
        badBody: "網址少了邀請碼。請對方重新分享一次。",
        errTitle: "讀不到這個邀請",
        errBody: "網路好像有點問題，重新整理看看。",
        from: (n) => `<b>${n}</b> 約你打球`,
        fromAnon: "有人約你打球",
        today: "今天", tomorrow: "明天", past: "已經開始了",
        inDays: (d) => `${d} 天後`,
        durationOf: (m) => m % 60 === 0 ? `打 ${m / 60} 小時` : `打 ${m} 分鐘`,
        lbFormat: "要打什麼", lbBall: "用球",
        going: (n) => n === 0 ? "還沒有人回覆" : `已經有 ${n} 人要去`,
        beginnerTitle: "歡迎第一次打的人",
        beginnerBody: "不用會發球、失誤多沒關係。主辦人事先講明了。",
        courtsUnit: (n) => `${n} 面球場`,
        lights: "夜間照明", indoor: "室內",
        free: "免費", paid: "付費", priv: "私人",
        confirmed: (n) => `${n} 位球友確認過`,
        parking: "有停車資訊",
        openMap: "在地圖上看這座球場 →",
        getApp: "下載 Tennis Nut 回覆這場約球",
        howHave: "已經有 App 了？打開 <b>Tennis Nut</b> → 地圖上點這座球場 → 在「約球」按 <b>我要去</b>。",
        surfaces: { hard: "硬地", clay: "紅土", grass: "草地", artificial_grass: "人工草",
          omni: "Omni／砂入人工草", concrete: "水泥", pu: "PU", carpet: "地毯",
          other: "其他", unknown: "材質未知" },
        formats: { rally: "慢球長來回", crosscourt: "半場對角", serve_return: "發球與接發",
          points: "打點／比賽", free: "自由對打" },
        balls: { yellow: "一般黃球", green: "綠點球", orange: "橘點球", red: "紅點球" },
        ballBlurb: { green: "球速慢一點，來回打得比較久", orange: "更慢，適合縮短場地",
          red: "最慢，適合小場地" },
      },
      en: {
        loading: "Opening the invitation…",
        goneTitle: "This invitation has ended",
        goneBody: "It may have already happened, been cancelled, or the link may be incomplete. Ask whoever sent it to you.",
        badTitle: "Incomplete link",
        badBody: "The address is missing its invitation code. Ask them to share it again.",
        errTitle: "Couldn't load this invitation",
        errBody: "Something went wrong on the way. Try reloading.",
        from: (n) => `<b>${n}</b> invited you to hit`,
        fromAnon: "You've been invited to hit",
        today: "Today", tomorrow: "Tomorrow", past: "Already started",
        inDays: (d) => `In ${d} days`,
        durationOf: (m) => m % 60 === 0
          ? `${m / 60} hour${m / 60 === 1 ? "" : "s"}` : `${m} minutes`,
        lbFormat: "What we'll do", lbBall: "Ball",
        going: (n) => n === 0 ? "Nobody has replied yet" : `${n} going`,
        beginnerTitle: "First-timers welcome",
        beginnerBody: "No serve needed, misses are fine. The host said so up front.",
        courtsUnit: (n) => `${n} court${n === 1 ? "" : "s"}`,
        lights: "Floodlights", indoor: "Indoor",
        free: "Free", paid: "Paid", priv: "Private",
        confirmed: (n) => `Confirmed by ${n} player${n === 1 ? "" : "s"}`,
        parking: "Parking info",
        openMap: "See this court on the map →",
        getApp: "Get Tennis Nut to reply",
        howHave: "Already have it? Open <b>Tennis Nut</b> → tap this court on the map → under Hits, tap <b>I'm in</b>.",
        surfaces: { hard: "Hard", clay: "Clay", grass: "Grass", artificial_grass: "Artificial grass",
          omni: "Omni / sand-filled", concrete: "Concrete", pu: "PU", carpet: "Carpet",
          other: "Other", unknown: "Surface unknown" },
        formats: { rally: "Long rallies", crosscourt: "Half-court crosscourt",
          serve_return: "Serve and return", points: "Play points", free: "Just hit" },
        balls: { yellow: "Regular yellow", green: "Green dot", orange: "Orange dot", red: "Red dot" },
        ballBlurb: { green: "A little slower — rallies last longer",
          orange: "Slower still, suits a shortened court", red: "Slowest, for a small court" },
      },
    }[LANG];

    const LOCALE = LANG === "zh" ? "zh-Hant" : "en";
    document.getElementById("loadingTx").textContent = T.loading;

    const esc = (s) => String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");

    function showState(title, body) {
      document.getElementById("wrap").innerHTML =
        `<div class="state"><div class="big">🎾</div><h1>${esc(title)}</h1>` +
        `<p>${esc(body)}</p>` +
        `<a class="cta-cue" href="/courts-map">${LANG === "zh" ? "看看附近的球場" : "Browse courts near you"}</a></div>`;
    }

    // "Saturday 16 Aug, 7:00 PM" in the reader's own timezone — the host's
    // timezone is not the reader's, and a time that is off by hours is worse
    // than no time at all.
    function fmtWhen(iso) {
      const d = new Date(iso);
      const day = new Intl.DateTimeFormat(LOCALE,
        { weekday: "long", month: "short", day: "numeric" }).format(d);
      const time = new Intl.DateTimeFormat(LOCALE,
        { hour: "numeric", minute: "2-digit" }).format(d);
      return `${day} ${time}`;
    }

    // Days apart by calendar date, not by elapsed hours: an invitation at 9am
    // tomorrow is "tomorrow" even when it is 20 hours away.
    function fmtRel(iso) {
      const d = new Date(iso), now = new Date();
      const a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const days = Math.round((a - b) / 86400000);
      if (d < now) return T.past;
      if (days <= 0) return T.today;
      if (days === 1) return T.tomorrow;
      return T.inDays(days);
    }

    function render(h, court, parkingCount) {
      const surfaceKey = T.surfaces[court && court.surface_code] ? court.surface_code : "unknown";
      const chips = [];
      if (court) {
        chips.push(`<span class="chip">${esc(T.surfaces[surfaceKey])}</span>`);
        if (court.court_count) chips.push(`<span class="chip">${esc(T.courtsUnit(court.court_count))}</span>`);
        if (court.light) chips.push(`<span class="chip">${esc(T.lights)}</span>`);
        if (court.is_indoor) chips.push(`<span class="chip">${esc(T.indoor)}</span>`);
        if (court.access === "free") chips.push(`<span class="chip">${esc(T.free)}</span>`);
        else if (court.access === "paid") chips.push(`<span class="chip">${esc(T.paid)}</span>`);
        else if (court.access === "private") chips.push(`<span class="chip">${esc(T.priv)}</span>`);
        if (court.community_verify_count > 0)
          chips.push(`<span class="chip ok">✓ ${esc(T.confirmed(court.community_verify_count))}</span>`);
      }
      if (parkingCount > 0) chips.push(`<span class="chip">🅿️ ${esc(T.parking)}</span>`);

      const ballBlurb = T.ballBlurb[h.ball];

      document.getElementById("wrap").innerHTML = `
        <section class="invite">
          <p class="from">${h.host_name ? T.from(esc(h.host_name)) : esc(T.fromAnon)}</p>
          <p class="when">${esc(fmtWhen(h.starts_at))}</p>
          <p class="when-rel">${esc(fmtRel(h.starts_at))} · ${esc(T.durationOf(h.duration_min))}</p>

          <div class="agreed">
            <div class="ag">
              <div class="lb">${esc(T.lbFormat)}</div>
              <div class="vl">${esc(T.formats[h.format] || h.format)}</div>
            </div>
            <div class="ag">
              <div class="lb">${esc(T.lbBall)}</div>
              <div class="vl">${esc(T.balls[h.ball] || h.ball)}</div>
              ${ballBlurb ? `<div class="bl">${esc(ballBlurb)}</div>` : ""}
            </div>
          </div>

          ${h.beginners_welcome ? `
          <div class="beginner">
            <div class="ic">🌱</div>
            <div><b>${esc(T.beginnerTitle)}</b><span>${esc(T.beginnerBody)}</span></div>
          </div>` : ""}

          <p class="going">${esc(T.going(h.participant_count || 0))}</p>
        </section>

        <section class="court">
          <h2>${esc(h.court_name)}</h2>
          ${h.court_city ? `<p class="city">${esc(h.court_city)}</p>` : ""}
          <div class="chips">${chips.join("")}</div>
          <a class="maplink" href="/courts-map?court=${encodeURIComponent(h.court_id)}&lang=${LANG}">${esc(T.openMap)}</a>
        </section>

        <div class="act">
          <a class="btn" href="/join?lang=${LANG}">${esc(T.getApp)}</a>
          <p class="how">${T.howHave}</p>
        </div>

        <p class="langbar">
          <a href="?t=${encodeURIComponent(TOKEN)}&lang=zh" ${LANG === "zh" ? 'aria-current="true"' : ""}>中文</a>
          &nbsp;·&nbsp;
          <a href="?t=${encodeURIComponent(TOKEN)}&lang=en" ${LANG === "en" ? 'aria-current="true"' : ""}>English</a>
        </p>`;

      document.title = `${h.court_name} · ${fmtWhen(h.starts_at)} — Tennis Nut`;
    }

    async function main() {
      if (!TOKEN) { showState(T.badTitle, T.badBody); return; }
      const headers = { apikey: ANON, Authorization: "Bearer " + ANON,
                        "Content-Type": "application/json" };
      let hit;
      try {
        const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/hit_by_token",
          { method: "POST", headers, body: JSON.stringify({ p_token: TOKEN }) });
        if (!r.ok) throw new Error(r.status);
        const rows = await r.json();
        hit = rows && rows[0];
      } catch (_) {
        showState(T.errTitle, T.errBody);
        return;
      }
      // The function filters out cancelled and finished sessions, so an empty
      // result is the ordinary "you're too late" case, not a failure.
      if (!hit) { showState(T.goneTitle, T.goneBody); return; }

      // The invitation is worth showing on its own; the court's details are a
      // bonus, fetched separately so a slow or failed lookup cannot stop it.
      render(hit, null, 0);
      try {
        const [cr, pr] = await Promise.all([
          fetch(SUPABASE_URL + "/rest/v1/courts?select=surface_code,court_count,light" +
                ",is_indoor,access,community_verify_count&id=eq." + encodeURIComponent(hit.court_id),
                { headers }),
          fetch(SUPABASE_URL + "/rest/v1/court_parking?select=id&limit=1&court_id=eq." +
                encodeURIComponent(hit.court_id), { headers }),
        ]);
        const court = (await cr.json())[0];
        const parking = await pr.json();
        render(hit, court, Array.isArray(parking) ? parking.length : 0);
      } catch (_) { /* the invitation is already on screen */ }
    }
    main();
  </script>

  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
