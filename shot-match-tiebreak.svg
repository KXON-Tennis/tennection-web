  <text x="34" y="182" font-size="11.5" fill="#6E776F" font-weight="700">比分</text>
  <rect x="34" y="192" width="292" height="96" rx="12" fill="#FFFFFF" stroke="#ECEAE2"/>

  <text x="60" y="216" font-size="11" fill="#9BA29B">第一盤</text>
  <text x="200" y="216" font-size="13" fill="#1B5138" font-weight="800">6</text>
  <text x="228" y="216" font-size="13" fill="#6E776F" font-weight="800">4</text>

  <text x="60" y="244" font-size="11" fill="#9BA29B">第二盤</text>
  <text x="200" y="244" font-size="13" fill="#6E776F" font-weight="800">5</text>
  <text x="228" y="244" font-size="13" fill="#1B5138" font-weight="800">7</text>

  <text x="60" y="272" font-size="11" fill="#9BA29B">第三盤</text>
