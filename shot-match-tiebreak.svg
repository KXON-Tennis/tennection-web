<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 364" role="img" aria-label="記一場有搶七的比賽" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif">
  <rect x="4" y="4" width="352" height="356" rx="34" fill="#DEDACE"/>
  <rect x="8" y="8" width="344" height="348" rx="30" fill="#FBFAF6"/>
  <rect x="154" y="20" width="52" height="5" rx="2.5" fill="#C9C5B8"/>

  <text x="34" y="62" font-size="16" fill="#1B5138" font-weight="800">記一場比賽</text>
  <line x1="34" y1="80" x2="326" y2="80" stroke="#ECEAE2"/>

  <text x="34" y="104" font-size="11.5" fill="#6E776F" font-weight="700">對手</text>
  <rect x="34" y="114" width="292" height="40" rx="12" fill="#FFFFFF" stroke="#ECEAE2"/>
