<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>南北材質差異・直式 1080×1350 | Tennection</title>
  <style>
    :root {
      --bg: #0E1318; --line: rgba(255,255,255,.10);
      --clay: #FF6A3D; --hard: #4FA8FF;
      --ink: #F2F5F7; --ink2: #9FB0BD; --accent: #7ED957;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #05080b; display: block;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
    }
    /* 1080×1350 直式（IG 動態/限動） */
    .card {
      width: 1080px; height: 1350px;
      background:
        radial-gradient(900px 560px at 80% -6%, rgba(79,168,255,.16), transparent 60%),
        radial-gradient(860px 600px at 10% 110%, rgba(255,106,61,.18), transparent 60%),
        var(--bg);
      color: var(--ink); padding: 78px 84px 72px; display: flex; flex-direction: column;
      overflow: hidden;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand .brand-icon { width: 50px; height: 50px; border-radius: 50%; display: block; }
    .brand .brand-wm { height: 40px; width: auto; display: block; }
    .brand .muted { color: var(--ink2); font-weight: 700; font-size: 24px; }

    .kicker { margin-top: 50px; font-size: 31px; font-weight: 800; color: var(--ink2); letter-spacing: 2px; }
    h1 { margin-top: 12px; font-size: 92px; line-height: 1.03; font-weight: 900; letter-spacing: 1px; }
    h1 .hl { color: var(--clay); }

    .bars { margin-top: 56px; display: flex; flex-direction: column; gap: 34px; }
    .bar-row .lab { display: flex; align-items: baseline; gap: 14px; margin-bottom: 13px; }
    .bar-row .reg { font-size: 42px; font-weight: 900; }
    .bar-row .n { font-size: 23px; color: var(--ink2); font-weight: 700; }
    .track { height: 70px; border-radius: 16px; overflow: hidden; display: flex; background: #0a0e12; border: 1px solid var(--line); }
    .seg { height: 100%; display: flex; align-items: center; padding: 0 22px; font-weight: 900; font-size: 29px; color: #08121f; white-space: nowrap; }
    .seg.clay { background: linear-gradient(90deg, #FF7A4F, #FF5A29); color: #2a0d03; }
    .seg.hard { background: linear-gradient(90deg, #5FB0FF, #3E97F5); }

    .rank { margin-top: 50px; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 20px; padding: 24px 30px; }
    .rank .h { font-size: 28px; font-weight: 800; color: var(--clay); margin-bottom: 16px; }
    .rank .items { display: flex; gap: 14px; flex-wrap: wrap; }
    .chip { background: #1c242c; border: 1px solid var(--line); border-radius: 999px; padding: 12px 22px; font-size: 28px; font-weight: 800; }
    .chip b { color: var(--clay); }

    .foot { margin-top: auto; padding-top: 32px; border-top: 1px solid var(--line); }
    .foot .src { font-size: 24px; color: var(--ink2); line-height: 1.5; }
    .foot .src b { color: var(--ink); }
    .foot .url { margin-top: 14px; font-size: 31px; font-weight: 800; color: var(--accent); }
    .foot .url .small { display: block; font-size: 22px; color: var(--ink2); font-weight: 700; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img class="brand-icon" src="/app-icon.png" alt="Tennis Nut" />
      <img class="brand-wm" src="/wordmark-white.png" alt="Tennis Nut" />
      <span class="muted">· 全台網球場資料</span>
    </div>

    <div class="kicker">台灣網球場・南北材質差異</div>
    <h1>越往南，<br /><span class="hl">紅土</span>越多</h1>

    <div class="bars">
      <div class="bar-row">
        <div class="lab"><span class="reg">北部</span><span class="n">濁水溪以北 · 321 座</span></div>
        <div class="track">
          <div class="seg hard" style="width:91.9%">硬地 92%</div>
          <div class="seg clay" style="width:7.5%"></div>
        </div>
      </div>
      <div class="bar-row">
        <div class="lab"><span class="reg">南部</span><span class="n">濁水溪以南 · 238 座</span></div>
        <div class="track">
          <div class="seg hard" style="width:55.5%">硬地 55%</div>
          <div class="seg clay" style="width:42.4%">紅土 42%</div>
        </div>
      </div>
    </div>

    <div class="rank">
      <div class="h">🏆 紅土之都 — 各縣市紅土佔比</div>
      <div class="items">
        <span class="chip">高雄 <b>65%</b></span>
        <span class="chip">屏東 <b>55%</b></span>
        <span class="chip">台南 <b>36%</b></span>
        <span class="chip" style="opacity:.75">台北 <b>5.4%</b></span>
      </div>
    </div>

    <div class="foot">
      <div class="src">資料：全台 <b>559 座</b>球場・製作者十年人工蒐集，尚不完美</div>
      <div class="url">tennisnut.kxon.net/courts-map<span class="small">🗺️ 互動地圖・加 LINE/APP 一起補完</span></div>
    </div>
  </div>
</body>
</html>
